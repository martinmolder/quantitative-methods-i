- Class: meta
  Course: Quantitative Methods I
  Lesson: 14 - Interactions and non-linear associations
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Every model so far has assumed two things - that each predictor has the same effect for everybody, and that the relationship is a straight line. Both are often wrong. The survey is loaded as swe, with the trust score and a readable sex variable ready.

- Class: text
  Output: First, interactions. A model with trust plus bloc says the trust slope is identical for left and right voters, and forces it to be. An interaction lets it differ.

- Class: cmd_question
  Output: Fit one. Type model_int <- lm(demlevel ~ trust * bloc, data = swe).
  CorrectAnswer: model_int <- lm(demlevel ~ trust * bloc, data = swe)
  AnswerTests: omnitest(correctExpr='model_int <- lm(demlevel ~ trust * bloc, data = swe)')
  Hint: Type model_int <- lm(demlevel ~ trust * bloc, data = swe). The star puts in both variables and their product.

- Class: cmd_question
  Output: Look at the output. Type summary(model_int).
  CorrectAnswer: summary(model_int)
  AnswerTests: omnitest(correctExpr='summary(model_int)')
  Hint: Type summary(model_int).

- Class: mult_question
  Output: The coefficient on trust is 0.955. What is it the slope for?
  CorrectAnswer: Left-bloc voters only, because Left is the reference category.
  AnswerChoices: Left-bloc voters only, because Left is the reference category.; Everybody, averaged across the two blocs.; The difference between the blocs.
  AnswerTests: omnitest(correctVal='Left-bloc voters only, because Left is the reference category.')
  Hint: Once an interaction is in the model, the other coefficients are effects when the other variable is zero - and blocRight is zero for left voters.

- Class: text
  Output: So the slope for right-bloc voters is 0.955 plus the interaction term 0.211, which is 1.166. And blocRight, minus 0.134, is the bloc difference at trust equals zero - not overall. Here that is fine because trust is a factor score, so zero is the average. Had we used raw age, blocRight would have been the bloc difference among newborns.

- Class: text
  Output: Interaction coefficients are close to unreadable in a table. Nobody should do that arithmetic in their head.

- Class: cmd_question
  Output: Compute predicted values for both blocs. Type predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc")).
  CorrectAnswer: predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc"))
  AnswerTests: any_of_exprs('predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc"))', 'predictions <- predict_response(model_int, terms=c("trust [-2:2 by=0.5]", "bloc"))')
  Hint: Type predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc")).

- Class: cmd_question
  Output: Plot them with plot(predictions).
  CorrectAnswer: plot(predictions)
  AnswerTests: omnitest(correctExpr='plot(predictions)')
  Hint: Type plot(predictions).

- Class: mult_question
  Output: Two lines that are not parallel, and they cross at a trust score of about 0.63. What does that mean substantively?
  CorrectAnswer: Among distrusting people left voters rate democracy higher, and among trusting people right voters do.
  AnswerChoices: Among distrusting people left voters rate democracy higher, and among trusting people right voters do.; Right-bloc voters always rate democracy higher.; The two blocs do not differ at all.
  AnswerTests: omnitest(correctVal='Among distrusting people left voters rate democracy higher, and among trusting people right voters do.')
  Hint: Look at which line is on top at the left of the plot, and which is on top at the right.

- Class: text
  Output: So the answer to 'is there a winner-loser gap' is - it depends who you ask. That is what an interaction means, and no single coefficient could have said it. Non-parallel lines are what an interaction is. If you cannot see it on the plot, it is not there in any meaningful sense.

- Class: text
  Output: Now a case where the main effect actively misleads.

- Class: cmd_question
  Output: Fit model_age <- lm(lr_self ~ age * sex, data = swe).
  CorrectAnswer: model_age <- lm(lr_self ~ age * sex, data = swe)
  AnswerTests: omnitest(correctExpr='model_age <- lm(lr_self ~ age * sex, data = swe)')
  Hint: Type model_age <- lm(lr_self ~ age * sex, data = swe).

- Class: cmd_question
  Output: Look at the output. Type summary(model_age).
  CorrectAnswer: summary(model_age)
  AnswerTests: omnitest(correctExpr='summary(model_age)')
  Hint: Type summary(model_age).

- Class: mult_question
  Output: The coefficient on age is minus 0.0047 with a p-value of 0.29. Read carelessly, that says age does not matter. What does it actually say?
  CorrectAnswer: Age does not matter for men, who are the reference category.
  AnswerChoices: Age does not matter for men, who are the reference category.; Age does not matter for anybody.; Age matters, but the sample is too small to show it.
  AnswerTests: omnitest(correctVal='Age does not matter for men, who are the reference category.')
  Hint: Which group has sexWomen equal to zero?

- Class: text
  Output: For women the slope is minus 0.0047 plus 0.0189, which is plus 0.0142, and the interaction is significant. Swap the reference category from men to women and the age coefficient changes from non-significant to significant, with no change to the data at all. That is why you never report 'the effect of age' from a model with an interaction in it.

- Class: text
  Output: One warning. With ten predictors there are forty-five possible two-way interactions, and a couple would come out significant by chance. Test the ones you had a reason to expect.

- Class: text
  Output: Now the second assumption - that the relationship is a straight line. Who likes the Liberals? People tend to like parties that are close to them, and respondents place the Liberals at 6.4 on the left-right scale. So the rating should rise towards the party and fall again on the other side of it.

- Class: cmd_question
  Output: Fit a straight line anyway. Type linear <- lm(like_l ~ lr_self, data = swe).
  CorrectAnswer: linear <- lm(like_l ~ lr_self, data = swe)
  AnswerTests: omnitest(correctExpr='linear <- lm(like_l ~ lr_self, data = swe)')
  Hint: Type linear <- lm(like_l ~ lr_self, data = swe).

- Class: cmd_question
  Output: Look at the output. Type summary(linear).
  CorrectAnswer: summary(linear)
  AnswerTests: omnitest(correctExpr='summary(linear)')
  Hint: Type summary(linear).

- Class: text
  Output: Each point further right goes with a rating 0.30 points higher, clearly significant, and adjusted R-squared is 0.11. Nothing in the output says anything is wrong. Read as it stands, it says that the further right people are, the more they like the Liberals.

- Class: cmd_question
  Output: Look at the mean rating at each point of the scale. Type swe |> filter(!is.na(lr_self)) |> group_by(lr_self) |> summarise(mean = mean(like_l, na.rm = TRUE)).
  CorrectAnswer: swe |> filter(!is.na(lr_self)) |> group_by(lr_self) |> summarise(mean = mean(like_l, na.rm = TRUE))
  AnswerTests: any_of_exprs('swe |> filter(!is.na(lr_self)) |> group_by(lr_self) |> summarise(mean = mean(like_l, na.rm = TRUE))', 'swe |> filter(!is.na(lr_self)) |> group_by(lr_self) |> summarise(mean = mean(like_l, na.rm=TRUE))')
  Hint: Type swe |> filter(!is.na(lr_self)) |> group_by(lr_self) |> summarise(mean = mean(like_l, na.rm = TRUE)).

- Class: text
  Output: It rises to about 6, stays there until 8, and then falls. People at 10 like the party less than people at 5.

- Class: text
  Output: To let the line bend, add the square of the predictor as a second predictor. The model can then bend once - up and then down, or down and then up. This is called a quadratic model.

- Class: cmd_question
  Output: Fit it. Type quadratic <- lm(like_l ~ lr_self + I(lr_self^2), data = swe).
  CorrectAnswer: quadratic <- lm(like_l ~ lr_self + I(lr_self^2), data = swe)
  AnswerTests: omnitest(correctExpr='quadratic <- lm(like_l ~ lr_self + I(lr_self^2), data = swe)')
  Hint: Type quadratic <- lm(like_l ~ lr_self + I(lr_self^2), data = swe). The I() is needed because inside a formula the caret means something else.

- Class: cmd_question
  Output: Look at the output. Type summary(quadratic).
  CorrectAnswer: summary(quadratic)
  AnswerTests: omnitest(correctExpr='summary(quadratic)')
  Hint: Type summary(quadratic).

- Class: mult_question
  Output: The squared term is clearly significant. What does that say?
  CorrectAnswer: The relationship is not a straight line.
  AnswerChoices: The relationship is not a straight line.; Left-right placement has twice the effect we thought.; People on the left like the Liberals most.
  AnswerTests: omnitest(correctVal='The relationship is not a straight line.')
  Hint: A straight line is what you get when the squared term is zero.

- Class: text
  Output: Adjusted R-squared has gone from 0.11 to 0.16. The adjusted version is the one to compare, because the quadratic has one more term.

- Class: mult_question
  Output: The coefficient on lr_self is 1.019 and the one on its square is minus 0.072. Read together, what shape is that?
  CorrectAnswer: It rises, rises less and less, and then falls.
  AnswerChoices: It rises, rises less and less, and then falls.; It rises, and rises faster and faster.; It falls and then rises.
  AnswerTests: omnitest(correctVal='It rises, rises less and less, and then falls.')
  Hint: The positive term dominates at the left end of the scale. The negative squared term grows as you move right.

- Class: text
  Output: There is no single effect of left-right placement any more, so compare one-point steps in different places.

- Class: cmd_question
  Output: The step from 1 to 2 first. Type predict(quadratic, newdata = data.frame(lr_self = c(1, 2))).
  CorrectAnswer: predict(quadratic, newdata = data.frame(lr_self = c(1, 2)))
  AnswerTests: omnitest(correctExpr='predict(quadratic, newdata = data.frame(lr_self = c(1, 2)))')
  Hint: Type predict(quadratic, newdata = data.frame(lr_self = c(1, 2))).

- Class: cmd_question
  Output: From 2.868 to 3.671, a rise of 0.803. Now from 9 to 10. Type predict(quadratic, newdata = data.frame(lr_self = c(9, 10))).
  CorrectAnswer: predict(quadratic, newdata = data.frame(lr_self = c(9, 10)))
  AnswerTests: omnitest(correctExpr='predict(quadratic, newdata = data.frame(lr_self = c(9, 10)))')
  Hint: Type predict(quadratic, newdata = data.frame(lr_self = c(9, 10))).

- Class: text
  Output: From 5.246 to 4.894, a fall of 0.352.

- Class: text
  Output: The turning point is where the curve stops rising. It is minus the first coefficient divided by twice the second.

- Class: cmd_question
  Output: Save the coefficients. Type b <- coef(quadratic).
  CorrectAnswer: b <- coef(quadratic)
  AnswerTests: omnitest(correctExpr='b <- coef(quadratic)')
  Hint: Type b <- coef(quadratic).

- Class: cmd_question
  Output: Now work it out. Type -b[2] / (2 * b[3]).
  CorrectAnswer: -b[2] / (2 * b[3])
  AnswerTests: omnitest(correctExpr='-b[2] / (2 * b[3])')
  Hint: Type -b[2] / (2 * b[3]).

- Class: mult_question
  Output: 7.06, not far from where respondents place the party. About a quarter of the respondents are to the right of it. Why does that matter?
  CorrectAnswer: A quadratic always turns round somewhere, so the fall is only a finding if there are enough cases beyond the turning point.
  AnswerChoices: A quadratic always turns round somewhere, so the fall is only a finding if there are enough cases beyond the turning point.; The turning point has to be in the middle of the scale.; Without them the model could not be fitted.
  AnswerTests: omnitest(correctVal='A quadratic always turns round somewhere, so the fall is only a finding if there are enough cases beyond the turning point.')
  Hint: What would you think of the downturn if only two respondents were to the right of 7?

- Class: text
  Output: And have a reason for the curve. We had one - people like parties that are close to them. Adding squared terms to see what becomes significant is hunting, just as it is with interactions.
