- Class: meta
  Course: Quantitative Methods I
  Lesson: 14 - Interactions and non-linear associations
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Every model so far has assumed two things - that each predictor has the same effect for everybody, and that the relationship is a straight line. Both are often wrong. Two objects are loaded - swe with the trust score ready, and world, the country data from session 5.

- Class: text
  Output: First, interactions. A model with trust plus bloc says the trust slope is identical for left and right voters, and forces it to be. An interaction lets it differ.

- Class: cmd_question
  Output: Fit one. Type model_int <- lm(demlevel ~ trust * bloc, data = swe).
  CorrectAnswer: model_int <- lm(demlevel ~ trust * bloc, data = swe)
  AnswerTests: omnitest(correctExpr='model_int <- lm(demlevel ~ trust * bloc, data = swe)')
  Hint: Type model_int <- lm(demlevel ~ trust * bloc, data = swe). The star puts in both variables and their product.

- Class: cmd_question
  Output: Show the coefficients - round(coef(summary(model_int)), 3).
  CorrectAnswer: round(coef(summary(model_int)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model_int)), 3)')
  Hint: Type round(coef(summary(model_int)), 3).

- Class: mult_question
  Output: The coefficient on trust is 0.955. What is it the slope for?
  CorrectAnswer: Left-bloc voters only, because Left is the reference category.
  AnswerChoices: Left-bloc voters only, because Left is the reference category.; Everybody, averaged across the two blocs.; The difference between the blocs.
  AnswerTests: omnitest(correctVal='Left-bloc voters only, because Left is the reference category.')
  Hint: Once an interaction is in the model, the other coefficients are effects when the other variable is zero - and blocRight is zero for left voters.

- Class: text
  Output: So the slope for right-bloc voters is 0.955 plus the interaction term 0.211, which is 1.166. And blocRight, minus 0.134, is the bloc difference at trust equals zero - not overall. Here that is fine because trust is a factor score, so zero is the average. Had we used raw age, blocRight would have been the bloc difference among newborns.

- Class: text
  Output: Interaction coefficients are close to unreadable in a table. Nobody should do that arithmetic in their head.

- Class: cmd_question
  Output: Compute predicted values for both blocs. Type predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc")).
  CorrectAnswer: predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc"))
  AnswerTests: any_of_exprs('predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc"))', 'predictions <- predict_response(model_int, terms=c("trust [-2:2 by=0.5]", "bloc"))')
  Hint: Type predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc")).

- Class: cmd_question
  Output: Plot them with plot(predictions).
  CorrectAnswer: plot(predictions)
  AnswerTests: omnitest(correctExpr='plot(predictions)')
  Hint: Type plot(predictions).

- Class: mult_question
  Output: Two lines that are not parallel, and they cross at a trust score of about 0.63. What does that mean substantively?
  CorrectAnswer: Among distrusting people left voters rate democracy higher, and among trusting people right voters do.
  AnswerChoices: Among distrusting people left voters rate democracy higher, and among trusting people right voters do.; Right-bloc voters always rate democracy higher.; The two blocs do not differ at all.
  AnswerTests: omnitest(correctVal='Among distrusting people left voters rate democracy higher, and among trusting people right voters do.')
  Hint: Look at which line is on top at the left of the plot, and which is on top at the right.

- Class: text
  Output: So the answer to 'is there a winner-loser gap' is - it depends who you ask. That is what an interaction means, and no single coefficient could have said it. Non-parallel lines are what an interaction is. If you cannot see it on the plot, it is not there in any meaningful sense.

- Class: text
  Output: Now a case where the main effect actively misleads.

- Class: cmd_question
  Output: Fit model_age <- lm(lr_self ~ age * sex, data = swe).
  CorrectAnswer: model_age <- lm(lr_self ~ age * sex, data = swe)
  AnswerTests: omnitest(correctExpr='model_age <- lm(lr_self ~ age * sex, data = swe)')
  Hint: Type model_age <- lm(lr_self ~ age * sex, data = swe).

- Class: cmd_question
  Output: Look at it - round(coef(summary(model_age)), 4).
  CorrectAnswer: round(coef(summary(model_age)), 4)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model_age)), 4)')
  Hint: Type round(coef(summary(model_age)), 4).

- Class: mult_question
  Output: The coefficient on age is minus 0.0047 with a p-value of 0.29. Read carelessly, that says age does not matter. What does it actually say?
  CorrectAnswer: Age does not matter for men, who are the reference category.
  AnswerChoices: Age does not matter for men, who are the reference category.; Age does not matter for anybody.; Age matters, but the sample is too small to show it.
  AnswerTests: omnitest(correctVal='Age does not matter for men, who are the reference category.')
  Hint: Which group has sexWomen equal to zero?

- Class: text
  Output: For women the slope is minus 0.0047 plus 0.0189, which is plus 0.0142, and the interaction is significant. Swap the reference category from men to women and the age coefficient changes from non-significant to significant, with no change to the data at all. That is why you never report 'the effect of age' from a model with an interaction in it.

- Class: text
  Output: One warning. With ten predictors there are forty-five possible two-way interactions, and a couple would come out significant by chance. Test the ones you had a reason to expect.

- Class: text
  Output: Now the second assumption - that the relationship is a straight line. Session 5 gave us a case where it cannot be. Income has a floor at zero and no ceiling; life expectancy has both.

- Class: cmd_question
  Output: First put income in thousands of dollars, so that the coefficients are readable. Type world$gdp_k <- world$gdp / 1000.
  CorrectAnswer: world$gdp_k <- world$gdp / 1000
  AnswerTests: omnitest(correctExpr='world$gdp_k <- world$gdp / 1000')
  Hint: Type world$gdp_k <- world$gdp / 1000.

- Class: cmd_question
  Output: Fit a straight line anyway. Type linear <- lm(life ~ gdp_k, data = world).
  CorrectAnswer: linear <- lm(life ~ gdp_k, data = world)
  AnswerTests: omnitest(correctExpr='linear <- lm(life ~ gdp_k, data = world)')
  Hint: Type linear <- lm(life ~ gdp_k, data = world).

- Class: cmd_question
  Output: Look at the output. Type summary(linear).
  CorrectAnswer: summary(linear)
  AnswerTests: omnitest(correctExpr='summary(linear)')
  Hint: Type summary(linear).

- Class: cmd_question
  Output: Adjusted R-squared is 0.46, the coefficient is clearly significant, and nothing in the output says anything is wrong. Now ask it to predict for a very rich country, with 300 thousand dollars per head. Type predict(linear, newdata = data.frame(gdp_k = 300)).
  CorrectAnswer: predict(linear, newdata = data.frame(gdp_k = 300))
  AnswerTests: omnitest(correctExpr='predict(linear, newdata = data.frame(gdp_k = 300))')
  Hint: Type predict(linear, newdata = data.frame(gdp_k = 300)).

- Class: text
  Output: A life expectancy of 132 years. The model is not confused - it is doing what a straight line does. The mistake was ours, in fitting one.

- Class: text
  Output: To let the line bend, add the square of the predictor as a second predictor. The model can then bend once - up and then down, or down and then up. This is called a quadratic model.

- Class: cmd_question
  Output: Fit it. Type quadratic <- lm(life ~ gdp_k + I(gdp_k^2), data = world).
  CorrectAnswer: quadratic <- lm(life ~ gdp_k + I(gdp_k^2), data = world)
  AnswerTests: omnitest(correctExpr='quadratic <- lm(life ~ gdp_k + I(gdp_k^2), data = world)')
  Hint: Type quadratic <- lm(life ~ gdp_k + I(gdp_k^2), data = world). The I() is needed because inside a formula the caret means something else.

- Class: cmd_question
  Output: Look at the output. Type summary(quadratic).
  CorrectAnswer: summary(quadratic)
  AnswerTests: omnitest(correctExpr='summary(quadratic)')
  Hint: Type summary(quadratic).

- Class: mult_question
  Output: The squared term is clearly significant. What does that say?
  CorrectAnswer: The relationship is not a straight line.
  AnswerChoices: The relationship is not a straight line.; Income has twice the effect we thought.; Life expectancy falls as countries get richer.
  AnswerTests: omnitest(correctVal='The relationship is not a straight line.')
  Hint: A straight line is what you get when the squared term is zero.

- Class: text
  Output: Adjusted R-squared has gone from 0.46 to 0.62. The adjusted version is the one to compare, because the quadratic has one more term.

- Class: mult_question
  Output: The coefficient on gdp_k is 0.499 and the one on its square is minus 0.003. Read together, what shape is that?
  CorrectAnswer: It rises, and rises less and less.
  AnswerChoices: It rises, and rises less and less.; It rises, and rises faster and faster.; It falls and then rises.
  AnswerTests: omnitest(correctVal='It rises, and rises less and less.')
  Hint: The positive term dominates when income is low. The negative squared term grows as income grows.

- Class: text
  Output: There is no single effect of income any more, so give predictions at several values. Compare two steps of the same size.

- Class: cmd_question
  Output: The first step is from 5 to 15 thousand dollars. Type predict(quadratic, newdata = data.frame(gdp_k = c(5, 15))).
  CorrectAnswer: predict(quadratic, newdata = data.frame(gdp_k = c(5, 15)))
  AnswerTests: omnitest(correctExpr='predict(quadratic, newdata = data.frame(gdp_k = c(5, 15)))')
  Hint: Type predict(quadratic, newdata = data.frame(gdp_k = c(5, 15))).

- Class: cmd_question
  Output: 67.1 and 71.5, about 4.4 years more. Now from 50 to 60 thousand. Type predict(quadratic, newdata = data.frame(gdp_k = c(50, 60))).
  CorrectAnswer: predict(quadratic, newdata = data.frame(gdp_k = c(50, 60)))
  AnswerTests: omnitest(correctExpr='predict(quadratic, newdata = data.frame(gdp_k = c(50, 60)))')
  Hint: Type predict(quadratic, newdata = data.frame(gdp_k = c(50, 60))).

- Class: text
  Output: 82.1 and 83.8, about 1.7 years more. The same ten thousand dollars goes with much less at the top.

- Class: cmd_question
  Output: The turning point is where the curve stops rising. It is minus the first coefficient divided by twice the second. Save the coefficients. Type b <- coef(quadratic).
  CorrectAnswer: b <- coef(quadratic)
  AnswerTests: omnitest(correctExpr='b <- coef(quadratic)')
  Hint: Type b <- coef(quadratic).

- Class: cmd_question
  Output: Now work it out. Type -b[2] / (2 * b[3]).
  CorrectAnswer: -b[2] / (2 * b[3])
  AnswerTests: omnitest(correctExpr='-b[2] / (2 * b[3])')
  Hint: Type -b[2] / (2 * b[3]).

- Class: text
  Output: About 83 thousand dollars. Only two of the 117 countries are richer than that, so the bend downwards after it rests on almost nothing.

- Class: cmd_question
  Output: A quadratic always turns round eventually, whether or not the world does. Ask it about 300 thousand dollars. Type predict(quadratic, newdata = data.frame(gdp_k = 300)).
  CorrectAnswer: predict(quadratic, newdata = data.frame(gdp_k = 300))
  AnswerTests: omnitest(correctExpr='predict(quadratic, newdata = data.frame(gdp_k = 300))')
  Hint: Type predict(quadratic, newdata = data.frame(gdp_k = 300)).

- Class: mult_question
  Output: Minus 57 years. What is the right conclusion?
  CorrectAnswer: Use the quadratic to describe the relationship where the data are, and not beyond.
  AnswerChoices: Use the quadratic to describe the relationship where the data are, and not beyond.; Life expectancy falls below zero in very rich countries.; The straight line was right after all.
  AnswerTests: omnitest(correctVal='Use the quadratic to describe the relationship where the data are, and not beyond.')
  Hint: The richest country in the data is at about 135 thousand dollars.

- Class: text
  Output: And have a reason for the curve. A squared term belongs in a model when there is an argument for a bend. Adding squared terms to see what becomes significant is hunting, just as it is with interactions.
