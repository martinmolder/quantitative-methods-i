- Class: meta
  Course: Quantitative Methods I
  Lesson: 14 - Interactions and non-linear associations
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Every model so far has assumed two things - that each predictor has the same effect for everybody, and that the relationship is a straight line. Both are often wrong. Two objects are loaded - swe with the trust score ready, and world, the country data from session 5.

- Class: text
  Output: First, interactions. A model with trust plus bloc says the trust slope is identical for left and right voters, and forces it to be. An interaction lets it differ.

- Class: cmd_question
  Output: Fit one. Type model_int <- lm(demlevel ~ trust * bloc, data = swe).
  CorrectAnswer: model_int <- lm(demlevel ~ trust * bloc, data = swe)
  AnswerTests: omnitest(correctExpr='model_int <- lm(demlevel ~ trust * bloc, data = swe)')
  Hint: Type model_int <- lm(demlevel ~ trust * bloc, data = swe). The star puts in both variables and their product.

- Class: cmd_question
  Output: Show the coefficients - round(coef(summary(model_int)), 3).
  CorrectAnswer: round(coef(summary(model_int)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model_int)), 3)')
  Hint: Type round(coef(summary(model_int)), 3).

- Class: mult_question
  Output: The coefficient on trust is 0.955. What is it the slope for?
  CorrectAnswer: Left-bloc voters only, because Left is the reference category.
  AnswerChoices: Left-bloc voters only, because Left is the reference category.; Everybody, averaged across the two blocs.; The difference between the blocs.
  AnswerTests: omnitest(correctVal='Left-bloc voters only, because Left is the reference category.')
  Hint: Once an interaction is in the model, the other coefficients are effects when the other variable is zero - and blocRight is zero for left voters.

- Class: text
  Output: So the slope for right-bloc voters is 0.955 plus the interaction term 0.211, which is 1.166. And blocRight, minus 0.134, is the bloc difference at trust equals zero - not overall. Here that is fine because trust is standardised so zero is the average. Had we used raw age, blocRight would have been the bloc difference among newborns.

- Class: text
  Output: Interaction coefficients are close to unreadable in a table. Nobody should do that arithmetic in their head.

- Class: cmd_question
  Output: Compute predicted values for both blocs. Type predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc")).
  CorrectAnswer: predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc"))
  AnswerTests: any_of_exprs('predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc"))', 'predictions <- predict_response(model_int, terms=c("trust [-2:2 by=0.5]", "bloc"))')
  Hint: Type predictions <- predict_response(model_int, terms = c("trust [-2:2 by=0.5]", "bloc")).

- Class: cmd_question
  Output: Plot them with plot(predictions).
  CorrectAnswer: plot(predictions)
  AnswerTests: omnitest(correctExpr='plot(predictions)')
  Hint: Type plot(predictions).

- Class: mult_question
  Output: Two lines that are not parallel, and they cross at about 0.63 standard deviations of trust. What does that mean substantively?
  CorrectAnswer: Among distrusting people left voters rate democracy higher, and among trusting people right voters do.
  AnswerChoices: Among distrusting people left voters rate democracy higher, and among trusting people right voters do.; Right-bloc voters always rate democracy higher.; The two blocs do not differ at all.
  AnswerTests: omnitest(correctVal='Among distrusting people left voters rate democracy higher, and among trusting people right voters do.')
  Hint: Look at which line is on top at the left of the plot, and which is on top at the right.

- Class: text
  Output: So the answer to 'is there a winner-loser gap' is - it depends who you ask. That is what an interaction means, and no single coefficient could have said it. Non-parallel lines are what an interaction is. If you cannot see it on the plot, it is not there in any meaningful sense.

- Class: text
  Output: Now a case where the main effect actively misleads.

- Class: cmd_question
  Output: Fit model_age <- lm(lr_self ~ age * sex, data = swe).
  CorrectAnswer: model_age <- lm(lr_self ~ age * sex, data = swe)
  AnswerTests: omnitest(correctExpr='model_age <- lm(lr_self ~ age * sex, data = swe)')
  Hint: Type model_age <- lm(lr_self ~ age * sex, data = swe).

- Class: cmd_question
  Output: Look at it - round(coef(summary(model_age)), 4).
  CorrectAnswer: round(coef(summary(model_age)), 4)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model_age)), 4)')
  Hint: Type round(coef(summary(model_age)), 4).

- Class: mult_question
  Output: The coefficient on age is minus 0.0047 with a p-value of 0.29. Read carelessly, that says age does not matter. What does it actually say?
  CorrectAnswer: Age does not matter for men, who are the reference category.
  AnswerChoices: Age does not matter for men, who are the reference category.; Age does not matter for anybody.; Age matters, but the sample is too small to show it.
  AnswerTests: omnitest(correctVal='Age does not matter for men, who are the reference category.')
  Hint: Which group has sexWomen equal to zero?

- Class: text
  Output: For women the slope is minus 0.0047 plus 0.0189, which is plus 0.0142, and the interaction is significant. Swap the reference category from men to women and the age coefficient changes from non-significant to significant, with no change to the data at all. That is why you never report 'the effect of age' from a model with an interaction in it.

- Class: text
  Output: One warning. With ten predictors there are forty-five possible two-way interactions, and a couple would come out significant by chance. Test the ones you had a reason to expect.

- Class: text
  Output: Now the second assumption - that the relationship is a straight line. Session 5 gave us a case where it cannot be. Income has a floor at zero and no ceiling; life expectancy has both.

- Class: cmd_question
  Output: Fit a straight line anyway. Type linear <- lm(life ~ gdp, data = world).
  CorrectAnswer: linear <- lm(life ~ gdp, data = world)
  AnswerTests: omnitest(correctExpr='linear <- lm(life ~ gdp, data = world)')
  Hint: Type linear <- lm(life ~ gdp, data = world).

- Class: cmd_question
  Output: Check the fit with summary(linear)$r.squared.
  CorrectAnswer: summary(linear)$r.squared
  AnswerTests: omnitest(correctExpr='summary(linear)$r.squared')
  Hint: Type summary(linear)$r.squared.

- Class: cmd_question
  Output: 0.46, and nothing in the output says anything is wrong. Now ask it to predict for a very rich country. Type predict(linear, newdata = data.frame(gdp = 300000)).
  CorrectAnswer: predict(linear, newdata = data.frame(gdp = 300000))
  AnswerTests: any_of_exprs('predict(linear, newdata = data.frame(gdp = 300000))', 'predict(linear, newdata=data.frame(gdp=300000))')
  Hint: Type predict(linear, newdata = data.frame(gdp = 300000)).

- Class: text
  Output: A life expectancy of 132 years. The model is not confused - it is doing what a straight line does. The mistake was ours, in fitting one.

- Class: text
  Output: The fix for a relationship that flattens is usually to take the logarithm of the predictor. A logarithm turns multiplication into addition, so the model works in proportional change rather than absolute dollars.

- Class: cmd_question
  Output: Fit it. Type logged <- lm(life ~ log(gdp), data = world).
  CorrectAnswer: logged <- lm(life ~ log(gdp), data = world)
  AnswerTests: omnitest(correctExpr='logged <- lm(life ~ log(gdp), data = world)')
  Hint: Type logged <- lm(life ~ log(gdp), data = world).

- Class: cmd_question
  Output: Compare the fits. Type c(linear = summary(linear)$r.squared, logged = summary(logged)$r.squared).
  CorrectAnswer: c(linear = summary(linear)$r.squared, logged = summary(logged)$r.squared)
  AnswerTests: omnitest(correctExpr='c(linear = summary(linear)$r.squared, logged = summary(logged)$r.squared)')
  Hint: Type c(linear = summary(linear)$r.squared, logged = summary(logged)$r.squared).

- Class: cmd_question
  Output: 0.46 against 0.69. And the prediction? Type predict(logged, newdata = data.frame(gdp = 300000)).
  CorrectAnswer: predict(logged, newdata = data.frame(gdp = 300000))
  AnswerTests: any_of_exprs('predict(logged, newdata = data.frame(gdp = 300000))', 'predict(logged, newdata=data.frame(gdp=300000))')
  Hint: Type predict(logged, newdata = data.frame(gdp = 300000)).

- Class: text
  Output: 89 years instead of 132. Still an extrapolation well beyond the data, but no longer impossible.

- Class: text
  Output: The coefficient on a logged predictor is the change for a one-unit change in the log, which nobody can picture. Multiply it by log(2) and you get the change for a doubling, which everybody can.

- Class: cmd_question
  Output: Type coef(logged)[2] * log(2).
  CorrectAnswer: coef(logged)[2] * log(2)
  AnswerTests: any_of_exprs('coef(logged)[2] * log(2)', 'coef(logged)[2]*log(2)')
  Hint: Type coef(logged)[2] * log(2).

- Class: text
  Output: Doubling income per head goes with about 3.65 more years of life expectancy - and the same whether you double from 2000 to 4000 or from 60000 to 120000. That is what the log model claims, and it is worth saying out loud because it might be wrong.

- Class: cmd_question
  Output: The other common approach is a squared term, which lets the line bend once. Type quadratic <- lm(life ~ gdp + I(gdp^2), data = world).
  CorrectAnswer: quadratic <- lm(life ~ gdp + I(gdp^2), data = world)
  AnswerTests: omnitest(correctExpr='quadratic <- lm(life ~ gdp + I(gdp^2), data = world)')
  Hint: Type quadratic <- lm(life ~ gdp + I(gdp^2), data = world). The I() is needed because inside a formula the caret means something else.

- Class: cmd_question
  Output: Compare it - summary(quadratic)$r.squared.
  CorrectAnswer: summary(quadratic)$r.squared
  AnswerTests: omnitest(correctExpr='summary(quadratic)$r.squared')
  Hint: Type summary(quadratic)$r.squared.

- Class: text
  Output: 0.62, worse than the log model's 0.69. And a quadratic always turns back on itself eventually, so extended far enough it predicts life expectancy falling as countries get richer. Choose the shape from what the variables are, not from the fit.
