- Class: meta
  Course: Quantitative Methods I
  Lesson: 07 - Analysing Categorical Data
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Two categorical variables - are they related, and how strongly? The Swedish survey is loaded as swe, with a readable sex variable already made for you.

- Class: cmd_question
  Output: Make a factor for Sweden Democrat voting, so that tables print words rather than 0 and 1. Type swe$sd_vote <- factor(swe$vote_sd, levels = c(0, 1), labels = c("Other party", "Sweden Democrats")).
  CorrectAnswer: swe$sd_vote <- factor(swe$vote_sd, levels = c(0, 1), labels = c("Other party", "Sweden Democrats"))
  AnswerTests: omnitest(correctExpr='swe$sd_vote <- factor(swe$vote_sd, levels = c(0, 1), labels = c("Other party", "Sweden Democrats"))')
  Hint: Type swe$sd_vote <- factor(swe$vote_sd, levels = c(0, 1), labels = c("Other party", "Sweden Democrats")).

- Class: cmd_question
  Output: Now cross-tabulate. Put table(swe$sex, swe$sd_vote) into an object called counts.
  CorrectAnswer: counts <- table(swe$sex, swe$sd_vote)
  AnswerTests: omnitest(correctExpr='counts <- table(swe$sex, swe$sd_vote)')
  Hint: Type counts <- table(swe$sex, swe$sd_vote). The first variable makes the rows.

- Class: cmd_question
  Output: Print counts to see it.
  CorrectAnswer: counts
  AnswerTests: omnitest(correctExpr='counts')
  Hint: Just type counts.

- Class: text
  Output: Counts are hard to read when the groups are different sizes. Percentages are better - but you have to choose what adds up to 100, and choosing wrongly is one of the commonest errors in student work.

- Class: cmd_question
  Output: Percentage within each row, so that each sex adds to 100. Type round(100 * prop.table(counts, 1), 1).
  CorrectAnswer: round(100 * prop.table(counts, 1), 1)
  AnswerTests: omnitest(correctExpr='round(100 * prop.table(counts, 1), 1)')
  Hint: Type round(100 * prop.table(counts, 1), 1). The 1 means rows.

- Class: cmd_question
  Output: Now the other direction, with 2 for columns.
  CorrectAnswer: round(100 * prop.table(counts, 2), 1)
  AnswerTests: omnitest(correctExpr='round(100 * prop.table(counts, 2), 1)')
  Hint: Type round(100 * prop.table(counts, 2), 1).

- Class: mult_question
  Output: You want to know whether being a man makes Sweden Democrat voting more likely. Which of the two tables answers that?
  CorrectAnswer: The row percentages, because they show the SD share within each sex.
  AnswerChoices: The row percentages, because they show the SD share within each sex.; The column percentages, because they show the sex breakdown of SD voters.; Either one - they contain the same information.
  AnswerTests: omnitest(correctVal='The row percentages, because they show the SD share within each sex.')
  Hint: Percentage within the explanatory variable. Which variable is doing the explaining here?

- Class: text
  Output: 18.9 per cent against 10.3 per cent. That looks like a difference. But we have a sample, so the question from last week applies - could a gap this size come from a population where men and women vote alike?

- Class: text
  Output: The test compares what we observed with what we would expect if the two variables were unrelated. If sex made no difference, the SD share would be the same in both rows and equal to the overall share. So each expected count is its row total times its column's share of all respondents - the column total divided by the number of respondents.

- Class: cmd_question
  Output: Get the row totals with rowSums(counts), and put them in an object called row_totals.
  CorrectAnswer: row_totals <- rowSums(counts)
  AnswerTests: omnitest(correctExpr='row_totals <- rowSums(counts)')
  Hint: Type row_totals <- rowSums(counts).

- Class: cmd_question
  Output: Now the column totals with colSums(counts), in an object called col_totals.
  CorrectAnswer: col_totals <- colSums(counts)
  AnswerTests: omnitest(correctExpr='col_totals <- colSums(counts)')
  Hint: Type col_totals <- colSums(counts).

- Class: cmd_question
  Output: And the number of respondents, sum(counts), in an object called n.
  CorrectAnswer: n <- sum(counts)
  AnswerTests: omnitest(correctExpr='n <- sum(counts)')
  Hint: Type n <- sum(counts).

- Class: cmd_question
  Output: One cell by hand first - men who voted for the Sweden Democrats. Divide the SD column total by n to get the SD share, and multiply the men's row total by it. Type row_totals["Men"] * (col_totals["Sweden Democrats"] / n).
  CorrectAnswer: row_totals["Men"] * (col_totals["Sweden Democrats"] / n)
  AnswerTests: any_of_exprs('row_totals["Men"] * (col_totals["Sweden Democrats"] / n)', 'row_totals["Men"]*col_totals["Sweden Democrats"]/n', 'row_totals["Men"] * col_totals["Sweden Democrats"] / n')
  Hint: Type row_totals["Men"] * (col_totals["Sweden Democrats"] / n).

- Class: text
  Output: About 159 SD-voting men if sex made no difference. The table says 209.

- Class: cmd_question
  Output: Every other cell works the same way. Multiply the men's row total by both column totals at once and you get the whole row for men. Type expected_men <- row_totals["Men"] * (col_totals / n).
  CorrectAnswer: expected_men <- row_totals["Men"] * (col_totals / n)
  AnswerTests: any_of_exprs('expected_men <- row_totals["Men"] * (col_totals / n)', 'expected_men <- row_totals["Men"]*col_totals/n', 'expected_men <- row_totals["Men"] * col_totals / n')
  Hint: Type expected_men <- row_totals["Men"] * (col_totals / n).

- Class: cmd_question
  Output: Now the same for women, in an object called expected_women.
  CorrectAnswer: expected_women <- row_totals["Women"] * (col_totals / n)
  AnswerTests: any_of_exprs('expected_women <- row_totals["Women"] * (col_totals / n)', 'expected_women <- row_totals["Women"]*col_totals/n', 'expected_women <- row_totals["Women"] * col_totals / n')
  Hint: Type expected_women <- row_totals["Women"] * (col_totals / n).

- Class: cmd_question
  Output: rbind() - row bind - stacks rows on top of each other into a table. Type expected <- rbind(Men = expected_men, Women = expected_women). The Men = and Women = parts name the rows.
  CorrectAnswer: expected <- rbind(Men = expected_men, Women = expected_women)
  AnswerTests: omnitest(correctExpr='expected <- rbind(Men = expected_men, Women = expected_women)')
  Hint: Type expected <- rbind(Men = expected_men, Women = expected_women).

- Class: cmd_question
  Output: Compare the two. Print round(expected, 1) and put it beside the counts in your head.
  CorrectAnswer: round(expected, 1)
  AnswerTests: omnitest(correctExpr='round(expected, 1)')
  Hint: Type round(expected, 1).

- Class: text
  Output: These are the two hypotheses, as tables. The expected counts are the null hypothesis written out - the table if sex and SD voting were unrelated. The observed counts stand for the alternative - the table as it actually is, association and all.

- Class: text
  Output: More SD-voting men than expected, fewer SD-voting women. The chi-squared statistic is the distance between the two tables, as last week's test statistic was the distance from the null value. For each cell, observed minus expected, squared, divided by expected, all added up.

- Class: cmd_question
  Output: Write that straight into R. Type sum((counts - expected)^2 / expected).
  CorrectAnswer: sum((counts - expected)^2 / expected)
  AnswerTests: any_of_exprs('sum((counts - expected)^2 / expected)', 'sum((counts-expected)^2/expected)')
  Hint: Type sum((counts - expected)^2 / expected).

- Class: cmd_question
  Output: R will do the whole thing, p-value included. Type chisq.test(counts, correct = FALSE).
  CorrectAnswer: chisq.test(counts, correct = FALSE)
  AnswerTests: any_of_exprs('chisq.test(counts, correct = FALSE)', 'chisq.test(counts, correct=FALSE)')
  Hint: Type chisq.test(counts, correct = FALSE). The correct argument switches off a small adjustment, so the number matches what you just calculated by hand.

- Class: text
  Output: Same statistic, 34.97. The p-value is the share of the distances the null hypothesis would produce by chance that are at least this large, and it is far below 0.05. A gap this size would be very unusual if men and women voted alike.

- Class: text
  Output: But a test only says whether something is there. It says nothing about size - and with a large enough sample, a trivial difference will pass. For categorical data the standard measure of size is the odds ratio.

- Class: cmd_question
  Output: Odds are the count in one category divided by the count in the other. Calculate the odds of SD voting for men - counts["Men", "Sweden Democrats"] divided by counts["Men", "Other party"] - and call it odds_men.
  CorrectAnswer: odds_men <- counts["Men", "Sweden Democrats"] / counts["Men", "Other party"]
  AnswerTests: any_of_exprs('odds_men <- counts["Men", "Sweden Democrats"] / counts["Men", "Other party"]', 'odds_men <- counts["Men","Sweden Democrats"]/counts["Men","Other party"]')
  Hint: Type odds_men <- counts["Men", "Sweden Democrats"] / counts["Men", "Other party"].

- Class: cmd_question
  Output: Now the same for women, in an object called odds_women.
  CorrectAnswer: odds_women <- counts["Women", "Sweden Democrats"] / counts["Women", "Other party"]
  AnswerTests: any_of_exprs('odds_women <- counts["Women", "Sweden Democrats"] / counts["Women", "Other party"]', 'odds_women <- counts["Women","Sweden Democrats"]/counts["Women","Other party"]')
  Hint: Type odds_women <- counts["Women", "Sweden Democrats"] / counts["Women", "Other party"].

- Class: cmd_question
  Output: The odds ratio is one divided by the other. Type odds_men / odds_women.
  CorrectAnswer: odds_men / odds_women
  AnswerTests: any_of_exprs('odds_men / odds_women', 'odds_men/odds_women')
  Hint: Type odds_men / odds_women.

- Class: mult_question
  Output: The odds ratio is about 2.03, and the probabilities were 18.9 per cent and 10.3 per cent. Which statement is correct?
  CorrectAnswer: The odds of SD voting were about twice as high for men, while the probability was about 1.8 times as high.
  AnswerChoices: The odds of SD voting were about twice as high for men, while the probability was about 1.8 times as high.; Men were about twice as likely as women to vote SD.; Men were 2.03 percentage points more likely to vote SD.
  AnswerTests: omnitest(correctVal='The odds of SD voting were about twice as high for men, while the probability was about 1.8 times as high.')
  Hint: Odds are not probabilities. Divide 18.9 by 10.3 and compare with 2.03.

- Class: cmd_question
  Output: The confidence interval for an odds ratio can be calculated by hand, but the effectsize package does it in one line. Its oddsratio() function takes the odds of the first column, which here is Other party, so reorder the columns to put the Sweden Democrats first. Type oddsratio(counts[, 2:1]).
  CorrectAnswer: oddsratio(counts[, 2:1])
  AnswerTests: any_of_exprs('oddsratio(counts[, 2:1])', 'oddsratio(counts[,2:1])', 'effectsize::oddsratio(counts[, 2:1])')
  Hint: Type oddsratio(counts[, 2:1]). The empty space before the comma keeps every row, and 2:1 takes column 2 then column 1.

- Class: text
  Output: An odds ratio of 2.03, with a 95 per cent confidence interval from 1.60 to 2.57. Leave out the reordering and you get 0.49 - the odds of voting for another party, men against women. The same association turned upside down, since 0.49 is one divided by 2.03.

- Class: text
  Output: An odds ratio of 1 means no association, so 1 plays the role that 0 plays elsewhere. A confidence interval that excludes 1 says the same thing as a p-value below 0.05.

- Class: text
  Output: All of this works on tables of any size, and the multiparty data is where it gets interesting.

- Class: cmd_question
  Output: Cross-tabulate education against vote. Put table(swe$educ3, swe$vote) into an object called educ_vote.
  CorrectAnswer: educ_vote <- table(swe$educ3, swe$vote)
  AnswerTests: omnitest(correctExpr='educ_vote <- table(swe$educ3, swe$vote)')
  Hint: Type educ_vote <- table(swe$educ3, swe$vote).

- Class: cmd_question
  Output: Run the test on it and keep the result. Type test <- chisq.test(educ_vote).
  CorrectAnswer: test <- chisq.test(educ_vote)
  AnswerTests: omnitest(correctExpr='test <- chisq.test(educ_vote)')
  Hint: Type test <- chisq.test(educ_vote).

- Class: cmd_question
  Output: Print test to see the result.
  CorrectAnswer: test
  AnswerTests: omnitest(correctExpr='test')
  Hint: Just type test.

- Class: text
  Output: Highly significant. But with 24 cells, 'there is an association' is not much of a finding. Where is it?

- Class: text
  Output: The answer is in observed minus expected again, cell by cell - but scaled. A raw difference means different things in different cells, because counts wander by chance and the bigger the count the more it wanders, roughly by its square root. So each difference is divided by the square root of the expected count. That puts every cell in units of its own chance variation, the same move as dividing by the standard error last week.

- Class: cmd_question
  Output: The test object keeps these scaled differences as residuals. Type round(test$residuals, 2).
  CorrectAnswer: round(test$residuals, 2)
  AnswerTests: omnitest(correctExpr='round(test$residuals, 2)')
  Hint: Type round(test$residuals, 2).

- Class: mult_question
  Output: Positive means more cases than expected and negative means fewer, with anything beyond about plus or minus 2 worth looking at. Which pair of columns shows the sharpest education divide?
  CorrectAnswer: The Sweden Democrats and the Greens, in opposite directions.
  AnswerChoices: The Sweden Democrats and the Greens, in opposite directions.; The Social Democrats and the Moderates, the two largest parties.; The Christian Democrats and the Liberals, the two smallest.
  AnswerTests: omnitest(correctVal='The Sweden Democrats and the Greens, in opposite directions.')
  Hint: Look for the largest numbers in the table, ignoring the sign.

- Class: text
  Output: SD strongly over-represented among those with no degree and under-represented among postgraduates. The Greens the same in reverse, and even sharper. That is the education divide in Swedish politics, from one table.

- Class: cmd_question
  Output: One last link. Square the residuals and add them up - type sum(test$residuals^2) - and compare the result with the X-squared that test printed.
  CorrectAnswer: sum(test$residuals^2)
  AnswerTests: any_of_exprs('sum(test$residuals^2)', 'sum(test$residuals ^ 2)')
  Hint: Type sum(test$residuals^2).

- Class: text
  Output: The same number. The chi-squared statistic is the total distance between the observed and the expected table, and the residuals show which cells that distance comes from.

- Class: text
  Output: One warning before we finish. The chi-squared approximation needs expected counts of at least about 5 in every cell. When R warns you about that, look at the expected table - small categories should be merged, dropped and reported, or handled with fisher.test() instead.
