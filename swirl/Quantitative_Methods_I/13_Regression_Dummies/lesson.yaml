- Class: meta
  Course: Quantitative Methods I
  Lesson: 13 - Regression with dummy variables
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Regression needs numbers. Party choice is not a number, and neither is sex or education group. This lesson is about how categorical predictors get into a model and how to read what comes out. The survey is loaded as swe, with a readable sex variable ready.

- Class: cmd_question
  Output: Start with two categories. Fit model_sex <- lm(lr_self ~ sex, data = swe).
  CorrectAnswer: model_sex <- lm(lr_self ~ sex, data = swe)
  AnswerTests: omnitest(correctExpr='model_sex <- lm(lr_self ~ sex, data = swe)')
  Hint: Type model_sex <- lm(lr_self ~ sex, data = swe).

- Class: cmd_question
  Output: Look at the full output. Type summary(model_sex).
  CorrectAnswer: summary(model_sex)
  AnswerTests: omnitest(correctExpr='summary(model_sex)')
  Hint: Type summary(model_sex).

- Class: text
  Output: Read it as in session 11. What is new is the row called sexWomen. R cannot put words into an equation, so it made a variable that is 1 for women and 0 for men, and put that in the model. A 0/1 variable like that is a dummy variable.

- Class: text
  Output: Why sexWomen? R names a dummy by gluing the name of the variable to the category coded 1 - sex plus Women. Men appear in no name - they are the 0, the group the dummy is compared with. The intercept is the prediction when the dummy is 0 - the mean for men - and the coefficient is what to add when it is 1.

- Class: mult_question
  Output: sexWomen is -0.787. What does that mean?
  CorrectAnswer: Women place themselves 0.79 points further left than men, on average.
  AnswerChoices: Women place themselves 0.79 points further left than men, on average.; Being a woman lowers left-right placement by 0.787 per cent.; Women are 0.787 times as right-wing as men.
  AnswerTests: omnitest(correctVal='Women place themselves 0.79 points further left than men, on average.')
  Hint: The coefficient is what to add, in points of the 0-10 scale, when the dummy goes from 0 (men) to 1 (women).

- Class: cmd_question
  Output: Check that against the group means. Type swe |> filter(!is.na(sex)) |> group_by(sex) |> summarise(mean = mean(lr_self, na.rm = TRUE)).
  CorrectAnswer: swe |> filter(!is.na(sex)) |> group_by(sex) |> summarise(mean = mean(lr_self, na.rm = TRUE))
  AnswerTests: any_of_exprs('swe |> filter(!is.na(sex)) |> group_by(sex) |> summarise(mean = mean(lr_self, na.rm = TRUE))', 'swe |> filter(!is.na(sex)) |> group_by(sex) |> summarise(mean = mean(lr_self, na.rm=TRUE))')
  Hint: Type swe |> filter(!is.na(sex)) |> group_by(sex) |> summarise(mean = mean(lr_self, na.rm = TRUE)).

- Class: mult_question
  Output: The intercept is 5.638 and the men's mean, rounded, is 5.64. What is a regression with a single categorical predictor actually doing?
  CorrectAnswer: Comparing group means - the coefficient is the difference between them.
  AnswerChoices: Comparing group means - the coefficient is the difference between them.; Fitting a curve through the two categories.; Predicting sex from left-right placement.
  AnswerTests: omnitest(correctVal='Comparing group means - the coefficient is the difference between them.')
  Hint: Add the intercept and the coefficient. What number do you get, and where have you seen it?

- Class: text
  Output: The category with no coefficient - men here - is the reference category. Everything is expressed relative to it. R picks the first level of the factor, which for plain text is alphabetical order unless you said otherwise.

- Class: text
  Output: Now the interesting case. Where do the voters of each of the eight parties place themselves?

- Class: cmd_question
  Output: Fit model_vote <- lm(lr_self ~ vote, data = swe).
  CorrectAnswer: model_vote <- lm(lr_self ~ vote, data = swe)
  AnswerTests: omnitest(correctExpr='model_vote <- lm(lr_self ~ vote, data = swe)')
  Hint: Type model_vote <- lm(lr_self ~ vote, data = swe).

- Class: cmd_question
  Output: Look at the full output. Type summary(model_vote).
  CorrectAnswer: summary(model_vote)
  AnswerTests: omnitest(correctExpr='summary(model_vote)')
  Hint: Type summary(model_vote).

- Class: mult_question
  Output: Eight parties, but only seven coefficients plus an intercept. Why seven?
  CorrectAnswer: Seven yes-or-no questions identify which of eight categories someone is in, and an eighth would add nothing.
  AnswerChoices: Seven yes-or-no questions identify which of eight categories someone is in, and an eighth would add nothing.; One party had too few respondents to estimate.; The eighth was dropped because it was not significant.
  AnswerTests: omnitest(correctVal='Seven yes-or-no questions identify which of eight categories someone is in, and an eighth would add nothing.')
  Hint: If all seven dummies are 0, which party must the respondent have voted for?

- Class: text
  Output: The names follow the same rule as before - voteMP is 1 for a Green voter and 0 for everyone else, voteS is 1 for a Social Democrat voter, and so on. The Left Party has no row, so it is the reference. It is the reference because it is the first level of the factor - we set the levels in left-to-right order when the data was built. So every coefficient is a comparison with V, and with nothing else.

- Class: cmd_question
  Output: Add the intercept to each coefficient and you get the group means. Check with swe |> filter(!is.na(vote)) |> group_by(vote) |> summarise(mean = mean(lr_self, na.rm = TRUE)).
  CorrectAnswer: swe |> filter(!is.na(vote)) |> group_by(vote) |> summarise(mean = mean(lr_self, na.rm = TRUE))
  AnswerTests: any_of_exprs('swe |> filter(!is.na(vote)) |> group_by(vote) |> summarise(mean = mean(lr_self, na.rm = TRUE))', 'swe |> filter(!is.na(vote)) |> group_by(vote) |> summarise(mean = mean(lr_self, na.rm=TRUE))')
  Hint: Type swe |> filter(!is.na(vote)) |> group_by(vote) |> summarise(mean = mean(lr_self, na.rm = TRUE)).

- Class: text
  Output: 1.346 for V, and 1.346 plus 6.514 is 7.86 for SD. The model is a compact way of writing down eight group means.

- Class: text
  Output: Comparing everything to the Left Party, one of the smallest parties in the data, is rarely what you want. The reference is a presentational choice, not a statistical one.

- Class: cmd_question
  Output: Move the Social Democrats to the front. Type swe$vote_s <- relevel(swe$vote, ref = "S").
  CorrectAnswer: swe$vote_s <- relevel(swe$vote, ref = "S")
  AnswerTests: any_of_exprs('swe$vote_s <- relevel(swe$vote, ref = "S")', 'swe$vote_s <- relevel(swe$vote, ref="S")')
  Hint: Type swe$vote_s <- relevel(swe$vote, ref = "S").

- Class: cmd_question
  Output: Refit with the new variable. Type model_vote_s <- lm(lr_self ~ vote_s, data = swe).
  CorrectAnswer: model_vote_s <- lm(lr_self ~ vote_s, data = swe)
  AnswerTests: omnitest(correctExpr='model_vote_s <- lm(lr_self ~ vote_s, data = swe)')
  Hint: Type model_vote_s <- lm(lr_self ~ vote_s, data = swe).

- Class: cmd_question
  Output: And look. Type summary(model_vote_s).
  CorrectAnswer: summary(model_vote_s)
  AnswerTests: omnitest(correctExpr='summary(model_vote_s)')
  Hint: Type summary(model_vote_s).

- Class: text
  Output: The dummies now carry the new variable's name, and the Social Democrats are the party with no row. The intercept is the Social Democrat voter, and the coefficients are negative for parties to their left and positive for parties to their right. That is a table you can hand to a reader without explanation.

- Class: mult_question
  Output: Now look at the bottom lines - the R-squared values and the F-statistic. How do they compare with those of model_vote, which had the Left Party as reference?
  CorrectAnswer: They are identical - only the comparisons on display changed.
  AnswerChoices: They are identical - only the comparisons on display changed.; The fit is better, because the Social Democrats are the largest party.; The fit is worse, because more coefficients are negative.
  AnswerTests: omnitest(correctVal='They are identical - only the comparisons on display changed.')
  Hint: Changing the reference changes which differences are shown, not the model. Scroll up and compare the two outputs.

- Class: text
  Output: The model is the same whichever reference you choose. Pick deliberately - the largest category, a natural baseline, or the group your argument is about.

- Class: text
  Output: Seven coefficients raise a question the table cannot answer. Is party related to left-right placement, taken as one thing? You cannot answer that by scanning seven p-values.

- Class: text
  Output: The answer is already in the output, on its last line. The F-statistic tests whether the model explains anything at all, and this model is nothing but the party dummies - so here it tests party as a whole. F is 497.4 on 7 and 2079 degrees of freedom - the 7 is the seven dummies - with a single p-value for the lot.

- Class: text
  Output: With a real variable and a sample this size, the answer to 'is there anything there?' is nearly always yes. The more useful number is Adjusted R-squared, on the line just above - how much of the variation the variable accounts for, corrected for the number of dummies it took to do it.

- Class: mult_question
  Output: The F-test for model_sex was just as clearly significant. But its Adjusted R-squared is 0.019, against 0.625 for model_vote. What does that tell you?
  CorrectAnswer: Party accounts for about 62 per cent of the variation in left-right placement, sex for about 2 per cent.
  AnswerChoices: Party accounts for about 62 per cent of the variation in left-right placement, sex for about 2 per cent.; Party is more statistically significant than sex.; Sex has no relationship with left-right placement.
  AnswerTests: omnitest(correctVal='Party accounts for about 62 per cent of the variation in left-right placement, sex for about 2 per cent.')
  Hint: Adjusted R-squared is the share of the variance in the outcome the model accounts for. Both relationships are significant - what differs is how much.

- Class: text
  Output: Now a mistake worth meeting deliberately. Suppose you forget to make the variable a factor and R sees it as a number.

- Class: cmd_question
  Output: Type swe$vote_number <- as.numeric(swe$vote).
  CorrectAnswer: swe$vote_number <- as.numeric(swe$vote)
  AnswerTests: omnitest(correctExpr='swe$vote_number <- as.numeric(swe$vote)')
  Hint: Type swe$vote_number <- as.numeric(swe$vote).

- Class: cmd_question
  Output: Fit it and look. Type summary(lm(lr_self ~ vote_number, data = swe)).
  CorrectAnswer: summary(lm(lr_self ~ vote_number, data = swe))
  AnswerTests: omnitest(correctExpr='summary(lm(lr_self ~ vote_number, data = swe))')
  Hint: Type summary(lm(lr_self ~ vote_number, data = swe)).

- Class: mult_question
  Output: One coefficient instead of seven, a clean result, and a p-value below 0.001. What has the model assumed?
  CorrectAnswer: That the eight parties are equally spaced in the order the levels happen to be in.
  AnswerChoices: That the eight parties are equally spaced in the order the levels happen to be in.; That the parties are unordered, so the spacing does not matter.; Nothing - it is a valid alternative specification.
  AnswerTests: omnitest(correctVal='That the eight parties are equally spaced in the order the levels happen to be in.')
  Hint: A numeric predictor means one unit of change is always worth the same. Is the gap between V and MP the same as the gap between M and SD?

- Class: text
  Output: Here the levels happen to be in left-right order, so the nonsense is mild. Had they been alphabetical - C, KD, L, M, MP, S, SD, V - the model would have fitted a straight line through an arbitrary ordering, and it would still have produced a coefficient, a standard error and a p-value. Check class() before fitting.

- Class: cmd_question
  Output: Check it now. Type class(swe$vote).
  CorrectAnswer: class(swe$vote)
  AnswerTests: omnitest(correctExpr='class(swe$vote)')
  Hint: Type class(swe$vote).

- Class: text
  Output: Factor, as it should be. Now for a reader. A table of seven coefficients against a reference is hard to read. The predicted value for each party is easier, and predict_response() from session 12 gets it from the model.

- Class: cmd_question
  Output: Get the predictions. Type vote_predictions <- predict_response(model_vote, terms = "vote").
  CorrectAnswer: vote_predictions <- predict_response(model_vote, terms = "vote")
  AnswerTests: any_of_exprs('vote_predictions <- predict_response(model_vote, terms = "vote")', 'vote_predictions <- predict_response(model_vote, terms="vote")')
  Hint: Type vote_predictions <- predict_response(model_vote, terms = "vote").

- Class: cmd_question
  Output: Look at them. Type vote_predictions.
  CorrectAnswer: vote_predictions
  AnswerTests: omnitest(correctExpr='vote_predictions')
  Hint: Type vote_predictions.

- Class: mult_question
  Output: The prediction for the Sweden Democrats is 7.86. Where have you seen that number before?
  CorrectAnswer: It is the mean of the Sweden Democrat voters.
  AnswerChoices: It is the mean of the Sweden Democrat voters.; It is the coefficient on voteSD.; It is the difference between SD and the Social Democrats.
  AnswerTests: omnitest(correctVal='It is the mean of the Sweden Democrat voters.')
  Hint: Party is the only predictor, so what is the best prediction for a Sweden Democrat voter?

- Class: cmd_question
  Output: Plot them, on the full scale. Type plot(vote_predictions) + coord_cartesian(ylim = c(0, 10)).
  CorrectAnswer: plot(vote_predictions) + coord_cartesian(ylim = c(0, 10))
  AnswerTests: omnitest(correctExpr='plot(vote_predictions) + coord_cartesian(ylim = c(0, 10))')
  Hint: Type plot(vote_predictions) + coord_cartesian(ylim = c(0, 10)).

- Class: text
  Output: The points are the predictions and the lines their 95 per cent confidence intervals. No reference category is needed to read this, and you can compare any two parties. But overlapping intervals are not a test - to test two parties against each other, make one of them the reference and refit.
