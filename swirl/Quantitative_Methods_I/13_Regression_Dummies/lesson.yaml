- Class: meta
  Course: Quantitative Methods I
  Lesson: 13 - Regression with dummy variables
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Regression needs numbers. Party choice is not a number, and neither is sex or education group. This lesson is about how categorical predictors get into a model and how to read what comes out. The survey is loaded as swe, with a readable sex variable ready.

- Class: cmd_question
  Output: Start with two categories. Fit model_sex <- lm(lr_self ~ sex, data = swe).
  CorrectAnswer: model_sex <- lm(lr_self ~ sex, data = swe)
  AnswerTests: omnitest(correctExpr='model_sex <- lm(lr_self ~ sex, data = swe)')
  Hint: Type model_sex <- lm(lr_self ~ sex, data = swe).

- Class: cmd_question
  Output: Show the coefficients - round(coef(summary(model_sex)), 3).
  CorrectAnswer: round(coef(summary(model_sex)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model_sex)), 3)')
  Hint: Type round(coef(summary(model_sex)), 3).

- Class: text
  Output: R has created a variable called sexWomen, which is 1 for women and 0 for men. A 0/1 variable like that is a dummy variable. The intercept is the prediction when it is 0 - the mean for men - and the coefficient is what to add when it is 1.

- Class: cmd_question
  Output: Check that against the group means. Type tapply(swe$lr_self, swe$sex, mean, na.rm = TRUE).
  CorrectAnswer: tapply(swe$lr_self, swe$sex, mean, na.rm = TRUE)
  AnswerTests: any_of_exprs('tapply(swe$lr_self, swe$sex, mean, na.rm = TRUE)', 'tapply(swe$lr_self, swe$sex, mean, na.rm=TRUE)')
  Hint: Type tapply(swe$lr_self, swe$sex, mean, na.rm = TRUE).

- Class: mult_question
  Output: The intercept is 5.638 and the men's mean is 5.638. What is a regression with a single categorical predictor actually doing?
  CorrectAnswer: Comparing group means - the coefficient is the difference between them.
  AnswerChoices: Comparing group means - the coefficient is the difference between them.; Fitting a curve through the two categories.; Predicting sex from left-right placement.
  AnswerTests: omnitest(correctVal='Comparing group means - the coefficient is the difference between them.')
  Hint: Add the intercept and the coefficient. What number do you get, and where have you seen it?

- Class: text
  Output: The category with no coefficient - men here - is the reference category. Everything is expressed relative to it. R picks the first level of the factor, which for plain text is alphabetical order unless you said otherwise.

- Class: text
  Output: Now the interesting case. Where do the voters of each of the eight parties place themselves?

- Class: cmd_question
  Output: Fit model_vote <- lm(lr_self ~ vote, data = swe).
  CorrectAnswer: model_vote <- lm(lr_self ~ vote, data = swe)
  AnswerTests: omnitest(correctExpr='model_vote <- lm(lr_self ~ vote, data = swe)')
  Hint: Type model_vote <- lm(lr_self ~ vote, data = swe).

- Class: cmd_question
  Output: Show the coefficients - round(coef(summary(model_vote)), 3).
  CorrectAnswer: round(coef(summary(model_vote)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model_vote)), 3)')
  Hint: Type round(coef(summary(model_vote)), 3).

- Class: mult_question
  Output: Eight parties, but only seven coefficients plus an intercept. Why seven?
  CorrectAnswer: Seven yes-or-no questions identify which of eight categories someone is in, and an eighth would add nothing.
  AnswerChoices: Seven yes-or-no questions identify which of eight categories someone is in, and an eighth would add nothing.; One party had too few respondents to estimate.; The eighth was dropped because it was not significant.
  AnswerTests: omnitest(correctVal='Seven yes-or-no questions identify which of eight categories someone is in, and an eighth would add nothing.')
  Hint: If all seven dummies are 0, which party must the respondent have voted for?

- Class: text
  Output: The Left Party is the reference, because it is the first level of the factor - we set the levels in left-to-right order when the data was built. So every coefficient is a comparison with V, and with nothing else.

- Class: cmd_question
  Output: Add the intercept to each coefficient and you get the group means. Check with tapply(swe$lr_self, swe$vote, mean, na.rm = TRUE).
  CorrectAnswer: tapply(swe$lr_self, swe$vote, mean, na.rm = TRUE)
  AnswerTests: any_of_exprs('tapply(swe$lr_self, swe$vote, mean, na.rm = TRUE)', 'tapply(swe$lr_self, swe$vote, mean, na.rm=TRUE)')
  Hint: Type tapply(swe$lr_self, swe$vote, mean, na.rm = TRUE).

- Class: text
  Output: 1.346 for V, and 1.346 plus 6.514 is 7.86 for SD. The model is a compact way of writing down eight group means.

- Class: text
  Output: Comparing everything to the Left Party, the smallest party in the data, is rarely what you want. The reference is a presentational choice, not a statistical one.

- Class: cmd_question
  Output: Move the Social Democrats to the front. Type swe$vote_s <- relevel(swe$vote, ref = "S").
  CorrectAnswer: swe$vote_s <- relevel(swe$vote, ref = "S")
  AnswerTests: any_of_exprs('swe$vote_s <- relevel(swe$vote, ref = "S")', 'swe$vote_s <- relevel(swe$vote, ref="S")')
  Hint: Type swe$vote_s <- relevel(swe$vote, ref = "S").

- Class: cmd_question
  Output: Refit and look. Type round(coef(summary(lm(lr_self ~ vote_s, data = swe))), 3).
  CorrectAnswer: round(coef(summary(lm(lr_self ~ vote_s, data = swe))), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(lm(lr_self ~ vote_s, data = swe))), 3)')
  Hint: Type round(coef(summary(lm(lr_self ~ vote_s, data = swe))), 3).

- Class: text
  Output: Now the intercept is the Social Democrat voter, and the coefficients are negative for parties to their left and positive for parties to their right. That is a table you can hand to a reader without explanation.

- Class: cmd_question
  Output: Confirm that nothing else changed. Compare the R-squared of the two models - type c(summary(model_vote)$r.squared, summary(lm(lr_self ~ vote_s, data = swe))$r.squared).
  CorrectAnswer: c(summary(model_vote)$r.squared, summary(lm(lr_self ~ vote_s, data = swe))$r.squared)
  AnswerTests: omnitest(correctExpr='c(summary(model_vote)$r.squared, summary(lm(lr_self ~ vote_s, data = swe))$r.squared)')
  Hint: Type c(summary(model_vote)$r.squared, summary(lm(lr_self ~ vote_s, data = swe))$r.squared).

- Class: text
  Output: Identical. The model is the same whichever reference you choose - only the comparisons on display change. Pick deliberately - the largest category, a natural baseline, or the group your argument is about.

- Class: text
  Output: Seven coefficients raise a question the table cannot answer. Is party related to left-right placement, taken as one thing? You cannot answer that by scanning seven p-values.

- Class: cmd_question
  Output: The test for a categorical variable as a whole is an F-test. Type anova(model_vote).
  CorrectAnswer: anova(model_vote)
  AnswerTests: omnitest(correctExpr='anova(model_vote)')
  Hint: Type anova(model_vote).

- Class: text
  Output: One row for vote, with 7 degrees of freedom - the seven dummies - and a single p-value for the lot. This matters more when the individual coefficients are marginal, because a variable can have no single significant category and still improve the model.

- Class: text
  Output: Now a mistake worth meeting deliberately. Suppose you forget to make the variable a factor and R sees it as a number.

- Class: cmd_question
  Output: Type swe$vote_number <- as.numeric(swe$vote).
  CorrectAnswer: swe$vote_number <- as.numeric(swe$vote)
  AnswerTests: omnitest(correctExpr='swe$vote_number <- as.numeric(swe$vote)')
  Hint: Type swe$vote_number <- as.numeric(swe$vote).

- Class: cmd_question
  Output: Fit it and look. Type round(coef(summary(lm(lr_self ~ vote_number, data = swe))), 3).
  CorrectAnswer: round(coef(summary(lm(lr_self ~ vote_number, data = swe))), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(lm(lr_self ~ vote_number, data = swe))), 3)')
  Hint: Type round(coef(summary(lm(lr_self ~ vote_number, data = swe))), 3).

- Class: mult_question
  Output: One coefficient instead of seven, a clean result, and a p-value below 0.001. What has the model assumed?
  CorrectAnswer: That the eight parties are equally spaced in the order the levels happen to be in.
  AnswerChoices: That the eight parties are equally spaced in the order the levels happen to be in.; That the parties are unordered, so the spacing does not matter.; Nothing - it is a valid alternative specification.
  AnswerTests: omnitest(correctVal='That the eight parties are equally spaced in the order the levels happen to be in.')
  Hint: A numeric predictor means one unit of change is always worth the same. Is the gap between V and MP the same as the gap between M and SD?

- Class: text
  Output: Here the levels happen to be in left-right order, so the nonsense is mild. Had they been alphabetical - C, KD, L, M, MP, S, SD, V - the model would have fitted a straight line through an arbitrary ordering, and it would still have produced a coefficient, a standard error and a p-value. Check class() before fitting.

- Class: cmd_question
  Output: Check it now. Type class(swe$vote).
  CorrectAnswer: class(swe$vote)
  AnswerTests: omnitest(correctExpr='class(swe$vote)')
  Hint: Type class(swe$vote).

- Class: text
  Output: Factor, as it should be. A table of seven coefficients against a reference is hard to read, so for a reader, group means with confidence intervals are usually better than the coefficient table - and they let you compare any two parties, not just each one against the reference.
