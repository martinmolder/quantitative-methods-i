- Class: meta
  Course: Quantitative Methods I
  Lesson: Getting Started
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Welcome. This is the practical half of the first seminar. We will spend about half an hour in the console, getting used to the four things that everything else in this course is built on - objects, functions, vectors, and missing values.

- Class: text
  Output: When you see a prompt, type the command and press Enter. If you get stuck, type skip() and I will do it for you. If you want to leave and come back later, type bye() - your progress is saved.

- Class: text
  Output: Let us start with the simplest thing R can do, which is arithmetic.

- Class: cmd_question
  Output: Add 2, 4 and 4 together. Just type the sum as you would write it.
  CorrectAnswer: 2 + 4 + 4
  AnswerTests: any_of_exprs('2 + 4 + 4', '2+4+4')
  Hint: Type 2 + 4 + 4 and press Enter.

- Class: text
  Output: The [1] in front of the answer is not part of the answer. It tells you that the line begins with the first element of the result. With one number that is not useful, but with a long result printed over several lines it tells you where you are.

- Class: cmd_question
  Output: The ^ symbol raises a number to a power. Raising a number to the power of one half is the same as taking its square root. Raise 5 to the power of 0.5.
  CorrectAnswer: 5^0.5
  AnswerTests: any_of_exprs('5^0.5', '5 ^ 0.5')
  Hint: Type 5^0.5 and press Enter.

- Class: text
  Output: Doing arithmetic one line at a time is not much use. What makes R useful is that you can put a result somewhere and come back to it. A thing with a name is called an object, and you create one with the arrow <-, which you can read as 'put into'.

- Class: cmd_question
  Output: Put the result of 4 + 1 into an object called x1. The arrow points at the name that receives the value.
  CorrectAnswer: x1 <- 4 + 1
  AnswerTests: omnitest(correctExpr='x1 <- 4 + 1')
  Hint: Type x1 <- 4 + 1. In RStudio the shortcut Alt+- (Option+- on a Mac) inserts the arrow for you.

- Class: text
  Output: Notice that nothing was printed. Assigning is silent. If you run a line and nothing appears, that is usually because you assigned rather than printed.

- Class: cmd_question
  Output: To see what is inside an object, type its name on its own. Do that for x1.
  CorrectAnswer: x1
  AnswerTests: omnitest(correctExpr='x1')
  Hint: Just type x1 and press Enter.

- Class: text
  Output: Now for functions. A function is a named bundle of instructions - you give it something, it does something to it, and it gives you something back. Every function is written the same way - its name, then round brackets, then whatever goes in.

- Class: cmd_question
  Output: The function sqrt() takes a number and returns its square root. Use it to take the square root of 25.
  CorrectAnswer: sqrt(25)
  AnswerTests: omnitest(correctExpr='sqrt(25)')
  Hint: Type sqrt(25).

- Class: text
  Output: What goes inside the brackets are the function's arguments. Many functions take more than one, separated by commas, and most arguments have names which you give with a single = sign.

- Class: cmd_question
  Output: The function round() rounds a number. Its first argument is the number, and the argument called digits says how many places after the decimal point to keep. Round 3.14159 to 2 digits, naming the digits argument explicitly.
  CorrectAnswer: round(3.14159, digits = 2)
  AnswerTests: any_of_exprs('round(3.14159, digits = 2)', 'round(3.14159, digits=2)')
  Hint: Type round(3.14159, digits = 2).

- Class: text
  Output: It is usually the argument, not the function, that decides what actually happens. Throughout this course, whenever a function appears with an argument you have not seen before, the argument gets explained too.

- Class: text
  Output: A single number is rarely what you have. Data comes in columns - the age of every respondent, the vote of every respondent. In R a column of values is called a vector, and you build one with c(), which combines values. The c stands for combine.

- Class: cmd_question
  Output: Make a vector of five ages - 31, 45, 22, 58 and 39 - and put it into an object called age.
  CorrectAnswer: age <- c(31, 45, 22, 58, 39)
  AnswerTests: omnitest(correctExpr='age <- c(31, 45, 22, 58, 39)')
  Hint: Type age <- c(31, 45, 22, 58, 39). The values go inside c() separated by commas.

- Class: cmd_question
  Output: Functions work on a whole vector at once. Take the mean of age.
  CorrectAnswer: mean(age)
  AnswerTests: omnitest(correctExpr='mean(age)')
  Hint: Type mean(age).

- Class: cmd_question
  Output: Arithmetic also applies to every element at once, with no loop needed. Add 1 to age.
  CorrectAnswer: age + 1
  AnswerTests: any_of_exprs('age + 1', 'age+1', '1 + age')
  Hint: Type age + 1.

- Class: text
  Output: Every element of a vector has a position, and you can get at an element by asking for its position in square brackets.

- Class: cmd_question
  Output: Show the third element of age.
  CorrectAnswer: age[3]
  AnswerTests: omnitest(correctExpr='age[3]')
  Hint: Type age[3]. Square brackets, not round ones.

- Class: cmd_question
  Output: You can also assign to a position, which replaces the value there. Change the third element of age to 24.
  CorrectAnswer: age[3] <- 24
  AnswerTests: omnitest(correctExpr='age[3] <- 24')
  Hint: Type age[3] <- 24.

- Class: text
  Output: Real data has holes in it. A respondent refuses to answer, or a question was never asked. R writes a missing value as NA, which stands for 'not available'. NA is not zero and it is not blank - it is a marker meaning 'there should be a value here and there is not one'.

- Class: cmd_question
  Output: Set the second element of age to NA. Note that NA is typed in capitals and without quotation marks.
  CorrectAnswer: age[2] <- NA
  AnswerTests: omnitest(correctExpr='age[2] <- NA')
  Hint: Type age[2] <- NA.

- Class: cmd_question
  Output: Now take the mean of age again.
  CorrectAnswer: mean(age)
  AnswerTests: omnitest(correctExpr='mean(age)')
  Hint: Type mean(age).

- Class: mult_question
  Output: The answer was NA rather than a number. Why?
  CorrectAnswer: R does not know the missing value, so it does not know the mean, and declines to guess.
  AnswerChoices: R does not know the missing value, so it does not know the mean, and declines to guess.; R cannot calculate means on vectors that contain more than four values.; There is a mistake in the vector and it needs to be rebuilt.
  AnswerTests: omnitest(correctVal='R does not know the missing value, so it does not know the mean, and declines to guess.')
  Hint: Think about what R would have to assume in order to give you a number.

- Class: text
  Output: This is R being careful, not R being broken. To get an answer you have to say explicitly what should happen to the missing values.

- Class: cmd_question
  Output: The argument na.rm - short for 'NA remove' - tells a function to drop the missing values first. Take the mean of age with na.rm set to TRUE.
  CorrectAnswer: mean(age, na.rm = TRUE)
  AnswerTests: any_of_exprs('mean(age, na.rm = TRUE)', 'mean(age, na.rm=TRUE)', 'mean(age, na.rm = T)', 'mean(age, na.rm=T)')
  Hint: Type mean(age, na.rm = TRUE). Write TRUE in full rather than T - T can be overwritten, TRUE cannot.

- Class: text
  Output: Notice what that did. It changed the question. mean(age) asks for the mean of five values, one of which is unknown. mean(age, na.rm = TRUE) asks for the mean of the four values we have. Those are different questions, and which one you want is a decision rather than a technicality.

- Class: cmd_question
  Output: The function is.na() tests each element and gives back TRUE or FALSE. Run it on age.
  CorrectAnswer: is.na(age)
  AnswerTests: omnitest(correctExpr='is.na(age)')
  Hint: Type is.na(age).

- Class: cmd_question
  Output: R counts TRUE as 1 and FALSE as 0, so adding those up counts the missing values. Wrap is.na(age) in sum() to count how many are missing.
  CorrectAnswer: sum(is.na(age))
  AnswerTests: omnitest(correctExpr='sum(is.na(age))')
  Hint: Type sum(is.na(age)).

- Class: text
  Output: A vector is one variable. A whole data set is many variables of the same length side by side. That is a data frame - rows are cases, columns are variables.

- Class: cmd_question
  Output: First we need a second variable. Make a vector of five names - "Ada", "Bo", "Cleo", "Dag" and "Eva" - and put it into an object called name. Text values go in quotation marks.
  CorrectAnswer: name <- c("Ada", "Bo", "Cleo", "Dag", "Eva")
  AnswerTests: omnitest(correctExpr='name <- c("Ada", "Bo", "Cleo", "Dag", "Eva")')
  Hint: Type name <- c("Ada", "Bo", "Cleo", "Dag", "Eva"). Each name needs its own quotation marks.

- Class: cmd_question
  Output: The function data.frame() builds a data frame out of vectors. Each argument becomes a column and the argument's name becomes the column name. Build one called d, with a column called name holding name, and a column called age holding age.
  CorrectAnswer: d <- data.frame(name = name, age = age)
  AnswerTests: omnitest(correctExpr='d <- data.frame(name = name, age = age)')
  Hint: Type d <- data.frame(name = name, age = age).

- Class: cmd_question
  Output: Print d to see what you built.
  CorrectAnswer: d
  AnswerTests: omnitest(correctExpr='d')
  Hint: Just type d and press Enter.

- Class: text
  Output: Because a data frame is two-dimensional, referring to a position takes two numbers in square brackets - the row first, then the column, separated by a comma. Leaving one of them empty means 'all of them'.

- Class: cmd_question
  Output: Show the whole of the second row of d. Remember the comma, and leave the column position empty.
  CorrectAnswer: d[2, ]
  AnswerTests: any_of_exprs('d[2, ]', 'd[2,]')
  Hint: Type d[2, ] - the number before the comma, nothing after it.

- Class: mult_question
  Output: If d[2, ] is the second row, what is d[, 2]?
  CorrectAnswer: The second column.
  AnswerChoices: The second column.; The second row again.; An error, because the row is missing.
  AnswerTests: omnitest(correctVal='The second column.')
  Hint: Rows first, columns second. The empty position is the one that means 'all of them'.

- Class: text
  Output: Referring to columns by number is fragile - insert a column and every number shifts. Usually you want a column by name, and for that there is the dollar sign.

- Class: cmd_question
  Output: Get the age column out of d using the dollar sign.
  CorrectAnswer: d$age
  AnswerTests: omnitest(correctExpr='d$age')
  Hint: Type d$age.

- Class: cmd_question
  Output: That gives back a plain vector, so everything you know about vectors applies to it. Take the mean of d$age, dropping the missing value.
  CorrectAnswer: mean(d$age, na.rm = TRUE)
  AnswerTests: any_of_exprs('mean(d$age, na.rm = TRUE)', 'mean(d$age, na.rm=TRUE)', 'mean(d$age, na.rm = T)', 'mean(d$age, na.rm=T)')
  Hint: Type mean(d$age, na.rm = TRUE).

- Class: text
  Output: That is the whole toolkit for now. Objects hold things, functions do things to them, vectors are columns of values, NA marks what is missing, and a data frame is a set of columns side by side. Next week we take a real survey data set and start making it usable.
