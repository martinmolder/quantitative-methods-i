- Class: meta
  Course: Quantitative Methods I
  Lesson: 12 - Presenting regression results
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: You have a model. Now somebody else has to read it. The raw output of summary() is for you while you work - it is not for a reader. The survey is loaded as swe, with the trust score ready.

- Class: cmd_question
  Output: Fit three models of increasing size. First model1 <- lm(demlevel ~ trust, data = swe).
  CorrectAnswer: model1 <- lm(demlevel ~ trust, data = swe)
  AnswerTests: omnitest(correctExpr='model1 <- lm(demlevel ~ trust, data = swe)')
  Hint: Type model1 <- lm(demlevel ~ trust, data = swe).

- Class: cmd_question
  Output: Now model2 <- lm(demlevel ~ trust + bloc, data = swe).
  CorrectAnswer: model2 <- lm(demlevel ~ trust + bloc, data = swe)
  AnswerTests: omnitest(correctExpr='model2 <- lm(demlevel ~ trust + bloc, data = swe)')
  Hint: Type model2 <- lm(demlevel ~ trust + bloc, data = swe).

- Class: cmd_question
  Output: And model3 <- lm(demlevel ~ trust + bloc + age + educ, data = swe).
  CorrectAnswer: model3 <- lm(demlevel ~ trust + bloc + age + educ, data = swe)
  AnswerTests: omnitest(correctExpr='model3 <- lm(demlevel ~ trust + bloc + age + educ, data = swe)')
  Hint: Type model3 <- lm(demlevel ~ trust + bloc + age + educ, data = swe).

- Class: cmd_question
  Output: Put all three side by side. Type modelsummary(list(model1, model2, model3)).
  CorrectAnswer: modelsummary(list(model1, model2, model3))
  AnswerTests: omnitest(correctExpr='modelsummary(list(model1, model2, model3))')
  Hint: Type modelsummary(list(model1, model2, model3)).

- Class: mult_question
  Output: Better than three blocks of summary() output, but not publishable. What is the most obvious problem?
  CorrectAnswer: The rows are labelled with variable names from the code rather than words a reader would understand.
  AnswerChoices: The rows are labelled with variable names from the code rather than words a reader would understand.; The coefficients are rounded too heavily to be useful.; The models should be in the opposite order.
  AnswerTests: omnitest(correctVal='The rows are labelled with variable names from the code rather than words a reader would understand.')
  Hint: Imagine handing this to somebody who has never seen your data. What would they not understand?

- Class: cmd_question
  Output: Build a lookup of proper names. Type labels <- c("trust" = "Trust in institutions", "blocRight" = "Voted for the right bloc", "age" = "Age (years)", "educ" = "Education (ISCED level)").
  CorrectAnswer: labels <- c("trust" = "Trust in institutions", "blocRight" = "Voted for the right bloc", "age" = "Age (years)", "educ" = "Education (ISCED level)")
  AnswerTests: omnitest(correctExpr='labels <- c("trust" = "Trust in institutions", "blocRight" = "Voted for the right bloc", "age" = "Age (years)", "educ" = "Education (ISCED level)")')
  Hint: Type labels <- c("trust" = "Trust in institutions", "blocRight" = "Voted for the right bloc", "age" = "Age (years)", "educ" = "Education (ISCED level)").

- Class: cmd_question
  Output: Use it, and trim the bottom panel. Type modelsummary(list(model1, model2, model3), coef_map = labels, gof_map = c("nobs", "r.squared")).
  CorrectAnswer: modelsummary(list(model1, model2, model3), coef_map = labels, gof_map = c("nobs", "r.squared"))
  AnswerTests: any_of_exprs('modelsummary(list(model1, model2, model3), coef_map = labels, gof_map = c("nobs", "r.squared"))', 'modelsummary(list(model1, model2, model3), coef_map=labels, gof_map=c("nobs","r.squared"))')
  Hint: Type modelsummary(list(model1, model2, model3), coef_map = labels, gof_map = c("nobs", "r.squared")).

- Class: text
  Output: coef_map renames the coefficients and also sets their order - and anything left out of it is dropped, which is how the intercept disappeared. gof_map picks which goodness-of-fit rows to keep.

- Class: cmd_question
  Output: Name the columns by naming the list. Type modelsummary(list("Trust only" = model1, "Plus bloc" = model2, "Full model" = model3), coef_map = labels, gof_map = c("nobs", "r.squared")).
  CorrectAnswer: modelsummary(list("Trust only" = model1, "Plus bloc" = model2, "Full model" = model3), coef_map = labels, gof_map = c("nobs", "r.squared"))
  AnswerTests: any_of_exprs('modelsummary(list("Trust only" = model1, "Plus bloc" = model2, "Full model" = model3), coef_map = labels, gof_map = c("nobs", "r.squared"))', 'modelsummary(list("Trust only"=model1, "Plus bloc"=model2, "Full model"=model3), coef_map=labels, gof_map=c("nobs","r.squared"))')
  Hint: Give each element of the list a name in quotation marks.

- Class: text
  Output: Look at the Num.Obs. row - 2525, 2144, 2097. Every variable added drops everyone missing on it, so the three columns do not describe the same people. Always report n per model.

- Class: cmd_question
  Output: The number in brackets under each coefficient is the standard error. Many journals prefer confidence intervals. Type modelsummary(list("Full model" = model3), coef_map = labels, gof_map = c("nobs"), statistic = "conf.int").
  CorrectAnswer: modelsummary(list("Full model" = model3), coef_map = labels, gof_map = c("nobs"), statistic = "conf.int")
  AnswerTests: any_of_exprs('modelsummary(list("Full model" = model3), coef_map = labels, gof_map = c("nobs"), statistic = "conf.int")', 'modelsummary(list("Full model"=model3), coef_map=labels, gof_map=c("nobs"), statistic="conf.int")')
  Hint: Type modelsummary(list("Full model" = model3), coef_map = labels, gof_map = c("nobs"), statistic = "conf.int").

- Class: text
  Output: An interval shows the size of the effect and its uncertainty at once, and it does not invite the reader to scan for asterisks. Give intervals where the journal permits it.

- Class: text
  Output: A table is precise, but a plot is quicker to read - and for a model with many predictors, much quicker.

- Class: cmd_question
  Output: Draw a coefficient plot. Type modelplot(model3, coef_map = rev(labels)).
  CorrectAnswer: modelplot(model3, coef_map = rev(labels))
  AnswerTests: any_of_exprs('modelplot(model3, coef_map = rev(labels))', 'modelplot(model3, coef_map=rev(labels))')
  Hint: Type modelplot(model3, coef_map = rev(labels)). rev() reverses the order, because a plot builds upwards while a table reads downwards.

- Class: mult_question
  Output: The plot has a vertical line at zero. What does it tell you?
  CorrectAnswer: Any interval crossing it is a coefficient that cannot be distinguished from no relationship.
  AnswerChoices: Any interval crossing it is a coefficient that cannot be distinguished from no relationship.; It marks the average value of the predictors.; It separates the significant coefficients from the controls.
  AnswerTests: omnitest(correctVal='Any interval crossing it is a coefficient that cannot be distinguished from no relationship.')
  Hint: Zero is the value that means no association. What does it mean if the interval includes it?

- Class: text
  Output: But be careful comparing bar lengths on that plot. The coefficients are in different units - one standard deviation of trust, one year of age, one ISCED level - so their sizes are not comparable as drawn.

- Class: cmd_question
  Output: One fix is to standardise everything so that each coefficient is per standard deviation. Type round(coef(lm(scale(demlevel) ~ scale(trust) + bloc + scale(age) + scale(educ), data = swe)), 3).
  CorrectAnswer: round(coef(lm(scale(demlevel) ~ scale(trust) + bloc + scale(age) + scale(educ), data = swe)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(lm(scale(demlevel) ~ scale(trust) + bloc + scale(age) + scale(educ), data = swe)), 3)')
  Hint: Type round(coef(lm(scale(demlevel) ~ scale(trust) + bloc + scale(age) + scale(educ), data = swe)), 3). scale() subtracts the mean and divides by the standard deviation.

- Class: text
  Output: Now the sizes are comparable - trust does about twenty times the work of education. The cost is that the coefficients no longer mean anything in the units of the data, so this is a supplement, not a replacement.

- Class: text
  Output: The most useful thing you can show a reader is what the model expects to happen.

- Class: cmd_question
  Output: Compute predicted values across the range of trust. Type predictions <- predict_response(model3, terms = "trust [-2:2 by=0.5]").
  CorrectAnswer: predictions <- predict_response(model3, terms = "trust [-2:2 by=0.5]")
  AnswerTests: any_of_exprs('predictions <- predict_response(model3, terms = "trust [-2:2 by=0.5]")', 'predictions <- predict_response(model3, terms="trust [-2:2 by=0.5]")')
  Hint: Type predictions <- predict_response(model3, terms = "trust [-2:2 by=0.5]").

- Class: cmd_question
  Output: Print predictions.
  CorrectAnswer: predictions
  AnswerTests: omnitest(correctExpr='predictions')
  Hint: Just type predictions.

- Class: cmd_question
  Output: Plot them with plot(predictions).
  CorrectAnswer: plot(predictions)
  AnswerTests: omnitest(correctExpr='plot(predictions)')
  Hint: Type plot(predictions).

- Class: text
  Output: The shaded band is the 95 per cent confidence interval around the prediction. This says the same thing as the coefficient, but in a form a reader can use.

- Class: mult_question
  Output: Look at the top of the prediction table. At trust = 2 the predicted rating is 9.99 and the interval reaches 10.14. What is wrong?
  CorrectAnswer: The scale stops at 10, so the model has predicted something that cannot happen.
  AnswerChoices: The scale stops at 10, so the model has predicted something that cannot happen.; The confidence interval is too wide to be useful.; Nothing - predictions are allowed to exceed the observed range.
  AnswerTests: omnitest(correctVal='The scale stops at 10, so the model has predicted something that cannot happen.')
  Hint: What is the largest value demlevel can take?

- Class: text
  Output: Session 5 arriving in the middle of a regression. A straight line does not know the outcome is bounded, and extend it far enough and it will predict a rating of 12, a negative income, a probability of 1.4. Do not predict outside the range of your data, and always check predictions against the limits of the scale.

- Class: text
  Output: When a bounded outcome is the whole problem rather than an edge case, a straight line is the wrong model. That is session 15.
