- Class: meta
  Course: Quantitative Methods I
  Lesson: Data Management II
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Last week you cleaned variables one at a time with square brackets. This week the same work, with dplyr. Two objects are loaded - swe, the finished analysis data set, and counties, a small lookup table.

- Class: text
  Output: First the pipe. The symbol |> takes what is on its left and passes it as the first argument to what is on its right. Read it as 'and then'. The RStudio shortcut is Ctrl+Shift+M, or Cmd+Shift+M on a Mac.

- Class: cmd_question
  Output: Try it on something small. Take the vector c(4, 8, 15, 16), pipe it into mean(), and pipe that into round() with the argument digits set to 1.
  CorrectAnswer: c(4, 8, 15, 16) |> mean() |> round(digits = 1)
  AnswerTests: any_of_exprs('c(4, 8, 15, 16) |> mean() |> round(digits = 1)', 'c(4, 8, 15, 16) |> mean() |> round(digits=1)')
  Hint: Type c(4, 8, 15, 16) |> mean() |> round(digits = 1).

- Class: text
  Output: The reading order and the doing order are now the same. Nested inside one another it would have been round(mean(c(4, 8, 15, 16)), digits = 1), which you have to read from the middle outwards.

- Class: cmd_question
  Output: Now the data. select() keeps the columns you name, without quotation marks. Pipe swe into select() asking for vote, lr_self and satdem, and then into head().
  CorrectAnswer: swe |> select(vote, lr_self, satdem) |> head()
  AnswerTests: omnitest(correctExpr='swe |> select(vote, lr_self, satdem) |> head()')
  Hint: Type swe |> select(vote, lr_self, satdem) |> head().

- Class: cmd_question
  Output: select() also has helpers that pick columns by pattern. Pipe swe into select() with starts_with("like_") inside it, and then into names(), to see the eight party rating variables.
  CorrectAnswer: swe |> select(starts_with("like_")) |> names()
  AnswerTests: omnitest(correctExpr='swe |> select(starts_with("like_")) |> names()')
  Hint: Type swe |> select(starts_with("like_")) |> names(). The pattern needs quotation marks even though column names do not.

- Class: text
  Output: Eight parties, each rated from 0 to 10. CSES names its batteries systematically, which is what makes starts_with() worth knowing.

- Class: cmd_question
  Output: filter() keeps rows where a condition is TRUE. Pipe swe into filter() keeping respondents who voted for the Sweden Democrats - vote == "SD" - and then into nrow() to count them.
  CorrectAnswer: swe |> filter(vote == "SD") |> nrow()
  AnswerTests: omnitest(correctExpr='swe |> filter(vote == "SD") |> nrow()')
  Hint: Type swe |> filter(vote == "SD") |> nrow(). Remember the double equals sign, and the quotation marks around SD.

- Class: cmd_question
  Output: Several conditions go in the same filter(), separated by commas, and all must hold. Count the respondents who voted SD and are also under 40.
  CorrectAnswer: swe |> filter(vote == "SD", age < 40) |> nrow()
  AnswerTests: omnitest(correctExpr='swe |> filter(vote == "SD", age < 40) |> nrow()')
  Hint: Type swe |> filter(vote == "SD", age < 40) |> nrow().

- Class: text
  Output: Note something filter() does for you. A row whose condition works out to NA is dropped rather than kept as a row of NAs. In base R that needed which(). The cost is that the removal is silent - filter on a variable with a lot of missing data and those respondents disappear without a word.

- Class: cmd_question
  Output: mutate() adds columns. Give swe a new column called gap, the rating of the Social Democrats minus the rating of the Moderates - like_s minus like_m - then select just gap and pipe into summary().
  CorrectAnswer: swe |> mutate(gap = like_s - like_m) |> select(gap) |> summary()
  AnswerTests: omnitest(correctExpr='swe |> mutate(gap = like_s - like_m) |> select(gap) |> summary()')
  Hint: Type swe |> mutate(gap = like_s - like_m) |> select(gap) |> summary().

- Class: mult_question
  Output: Both ratings run from 0 to 10. What are the hard limits of their difference?
  CorrectAnswer: minus 10 to plus 10
  AnswerChoices: minus 10 to plus 10; 0 to 10; 0 to 20
  AnswerTests: omnitest(correctVal='minus 10 to plus 10')
  Hint: The largest possible difference happens when one rating is at its maximum and the other at its minimum.

- Class: text
  Output: The summary you just produced stays inside those limits, because swe has already been cleaned. Do the same arithmetic on the raw file, where the missing values are still coded 99, and the range runs from minus 99 to 99 instead.

- Class: cmd_question
  Output: arrange() sorts rows. Sort swe by age, largest first, using desc() around the variable name, then select age and vote and show the head().
  CorrectAnswer: swe |> arrange(desc(age)) |> select(age, vote) |> head()
  AnswerTests: omnitest(correctExpr='swe |> arrange(desc(age)) |> select(age, vote) |> head()')
  Hint: Type swe |> arrange(desc(age)) |> select(age, vote) |> head().

- Class: text
  Output: Now the part that base R does badly - calculating something separately for each group. summarise() collapses a data frame to one row, and group_by() splits it first so that you get one row per group.

- Class: cmd_question
  Output: Start without grouping. Pipe swe into summarise() with two arguments - n set to n(), and mean_lr set to mean(lr_self, na.rm = TRUE).
  CorrectAnswer: swe |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE))
  AnswerTests: any_of_exprs('swe |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE))', 'swe |> summarise(n = n(), mean_lr = mean(lr_self, na.rm=TRUE))')
  Hint: Type swe |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE)). The function n() counts rows and takes no arguments.

- Class: cmd_question
  Output: Now add a group_by(vote) between swe and the summarise(), to get the same two numbers for each of the eight parties.
  CorrectAnswer: swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE))
  AnswerTests: any_of_exprs('swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE))', 'swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm=TRUE))')
  Hint: Type swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE)).

- Class: text
  Output: Eight parties in the order they sit on the left-right scale, and their voters line up the same way - Left Party voters at one end, Sweden Democrat voters at the other. The ninth row, with vote missing, is everyone who did not vote or did not say.

- Class: text
  Output: The important thing is that going from one group to eight changed nothing in the code. That is why group_by() is worth learning properly.

- Class: cmd_question
  Output: Add arrange(mean_lr) on the end of that same pipeline, to sort the parties by where their voters place themselves.
  CorrectAnswer: swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE)) |> arrange(mean_lr)
  AnswerTests: any_of_exprs('swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm = TRUE)) |> arrange(mean_lr)', 'swe |> group_by(vote) |> summarise(n = n(), mean_lr = mean(lr_self, na.rm=TRUE)) |> arrange(mean_lr)')
  Hint: Add |> arrange(mean_lr) to the end of the previous command.

- Class: text
  Output: Next, doing the same thing to many columns at once. This data set has a seven-item trust battery and three separate eight-item party batteries. Treating thirty-one columns one at a time is thirty-one chances to make a typo that produces no error.

- Class: cmd_question
  Output: across() applies a function to a set of columns and goes inside mutate() or summarise(). Pipe swe into summarise() containing across(starts_with("like_"), \(x) mean(x, na.rm = TRUE)).
  CorrectAnswer: swe |> summarise(across(starts_with("like_"), \(x) mean(x, na.rm = TRUE)))
  AnswerTests: any_of_exprs('swe |> summarise(across(starts_with("like_"), \\(x) mean(x, na.rm = TRUE)))', 'swe |> summarise(across(starts_with("like_"), \\(x) mean(x, na.rm=TRUE)))', 'swe |> summarise(across(starts_with("like_"), function(x) mean(x, na.rm = TRUE)))')
  Hint: Type swe |> summarise(across(starts_with("like_"), \(x) mean(x, na.rm = TRUE))). The backslash and (x) create a small unnamed function on the spot - read it as 'given a column, which I will call x, do this to it'.

- Class: mult_question
  Output: Which party is rated highest on average?
  CorrectAnswer: The Social Democrats
  AnswerChoices: The Social Democrats; The Sweden Democrats; The Moderates
  AnswerTests: omnitest(correctVal='The Social Democrats')
  Hint: Look for the largest of the eight numbers, and remember that like_s is the Social Democrats.

- Class: text
  Output: The Social Democrats are both the largest party and the best liked. Those two things do not have to go together, and in many countries they do not.

- Class: text
  Output: Finally, joining. Often what you need is spread over two files. The counties table holds each county's number, its name, its official letter code, and which of the three historical lands it belongs to.

- Class: cmd_question
  Output: Look at it first. Show the head() of counties.
  CorrectAnswer: head(counties)
  AnswerTests: omnitest(correctExpr='head(counties)')
  Hint: Type head(counties).

- Class: cmd_question
  Output: swe already has county names attached, so join on those. swe also already has a land column, so take just the two columns you need from counties first. Pipe swe into left_join() whose first argument is select(counties, county, abbr) and whose by argument is "county", then into nrow().
  CorrectAnswer: swe |> left_join(select(counties, county, abbr), by = "county") |> nrow()
  AnswerTests: any_of_exprs('swe |> left_join(select(counties, county, abbr), by = "county") |> nrow()', 'swe |> left_join(select(counties, county, abbr), by="county") |> nrow()')
  Hint: Type swe |> left_join(select(counties, county, abbr), by = "county") |> nrow(). Joining two tables that share a column name other than the key gives you land.x and land.y, which is why we drop it first.

- Class: text
  Output: Still 2845 rows. That is what makes it a left join - every row of the first table is kept, and rows with no match get NA in the new columns. A join that silently fails to match is one of the commonest ways to lose data, so always count afterwards.

- Class: cmd_question
  Output: Check how many failed to match. Take the same join, then pull(abbr), then is.na(), then sum().
  CorrectAnswer: swe |> left_join(select(counties, county, abbr), by = "county") |> pull(abbr) |> is.na() |> sum()
  AnswerTests: any_of_exprs('swe |> left_join(select(counties, county, abbr), by = "county") |> pull(abbr) |> is.na() |> sum()', 'swe |> left_join(select(counties, county, abbr), by="county") |> pull(abbr) |> is.na() |> sum()')
  Hint: Add |> pull(abbr) |> is.na() |> sum() to the end of the previous join. pull() takes a single column out as a plain vector.

- Class: text
  Output: Five respondents have no county recorded. Five out of 2845 is nothing to worry about - but you only know that because you checked. When this lesson was written the same join quietly lost 1695 rows, because the county names had been read in a way that did not record their encoding, and text that is not marked can fail to compare equal to identical text that is. There was no error message. The only sign was this count.

- Class: cmd_question
  Output: One last pipeline, putting it all together. Take swe, drop the rows where land is missing with filter(!is.na(land)), group by land, and summarise n = n() and mean_sat = mean(satdem, na.rm = TRUE).
  CorrectAnswer: swe |> filter(!is.na(land)) |> group_by(land) |> summarise(n = n(), mean_sat = mean(satdem, na.rm = TRUE))
  AnswerTests: any_of_exprs('swe |> filter(!is.na(land)) |> group_by(land) |> summarise(n = n(), mean_sat = mean(satdem, na.rm = TRUE))', 'swe |> filter(!is.na(land)) |> group_by(land) |> summarise(n = n(), mean_sat = mean(satdem, na.rm=TRUE))')
  Hint: Type swe |> filter(!is.na(land)) |> group_by(land) |> summarise(n = n(), mean_sat = mean(satdem, na.rm = TRUE)). The exclamation mark means 'not'.

- Class: text
  Output: Satisfaction with democracy barely differs across the three lands. That is a real finding, and a useful reminder that most things you check will turn out not to differ much. Next week we stop cleaning data and start thinking about what shape a relationship can have before you look at any.
