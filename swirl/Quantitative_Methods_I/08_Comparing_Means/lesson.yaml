- Class: meta
  Course: Quantitative Methods I
  Lesson: 08 - Comparing Means
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: One categorical variable and one continuous one - does the average differ between groups? Three versions of that question, in order of how much they ask for. The survey is loaded as swe, with a readable sex variable ready.

- Class: text
  Output: Start with the simplest. The left-right scale runs 0 to 10, so its midpoint is 5. Do Swedes on average sit at the midpoint?

- Class: cmd_question
  Output: Look first. Draw a histogram of swe$lr_self with hist().
  CorrectAnswer: hist(swe$lr_self)
  AnswerTests: omnitest(correctExpr='hist(swe$lr_self)')
  Hint: Type hist(swe$lr_self).

- Class: cmd_question
  Output: Now the mean, dropping the missing values.
  CorrectAnswer: mean(swe$lr_self, na.rm = TRUE)
  AnswerTests: any_of_exprs('mean(swe$lr_self, na.rm = TRUE)', 'mean(swe$lr_self, na.rm=TRUE)')
  Hint: Type mean(swe$lr_self, na.rm = TRUE).

- Class: cmd_question
  Output: 5.24 against a midpoint of 5. The one-sample t-test asks whether a gap that size could be sampling noise. The argument mu is the value being tested against. Type t.test(swe$lr_self, mu = 5).
  CorrectAnswer: t.test(swe$lr_self, mu = 5)
  AnswerTests: any_of_exprs('t.test(swe$lr_self, mu = 5)', 't.test(swe$lr_self, mu=5)')
  Hint: Type t.test(swe$lr_self, mu = 5).

- Class: text
  Output: Read that output line by line, because every t-test in R prints the same shape. t is the gap divided by its standard error. df is degrees of freedom. The p-value is 0.0000288. The confidence interval is for the mean, and it excludes 5.

- Class: mult_question
  Output: So Swedes do not sit at the midpoint. But look at what we found - 0.24 of one point, on a scale with eleven positions. How should that be described?
  CorrectAnswer: Statistically significant and substantively negligible - both are true.
  AnswerChoices: Statistically significant and substantively negligible - both are true.; Significant, therefore important.; Not really significant, because the difference is small.
  AnswerTests: omnitest(correctVal='Statistically significant and substantively negligible - both are true.')
  Hint: The p-value answers 'could this be chance'. With 2448 respondents, what is the answer to that for very small differences?

- Class: text
  Output: So we need a measure of how big, alongside the p-value. The standard one is Cohen's d - the difference expressed in standard deviations.

- Class: cmd_question
  Output: Calculate it by hand. Divide the gap, mean(swe$lr_self, na.rm = TRUE) - 5, by sd(swe$lr_self, na.rm = TRUE).
  CorrectAnswer: (mean(swe$lr_self, na.rm = TRUE) - 5) / sd(swe$lr_self, na.rm = TRUE)
  AnswerTests: any_of_exprs('(mean(swe$lr_self, na.rm = TRUE) - 5) / sd(swe$lr_self, na.rm = TRUE)', '(mean(swe$lr_self, na.rm=TRUE) - 5) / sd(swe$lr_self, na.rm=TRUE)')
  Hint: Type (mean(swe$lr_self, na.rm = TRUE) - 5) / sd(swe$lr_self, na.rm = TRUE).

- Class: text
  Output: 0.085 standard deviations. Because it divides by the spread of the people, not by the standard error, it does not grow with the sample.

- Class: text
  Output: The rough convention is 0.2 small, 0.5 medium, 0.8 large - so this is well below small. The numbers come from the psychologist Jacob Cohen, who anchored them in heights of American girls - 0.2 is roughly 15- against 16-year-olds, 0.5 is 14 against 18, 0.8 is 13 against 18. He meant them as a fallback when nothing better is available, not as rules.

- Class: text
  Output: So ask both questions. The p-value says whether an effect is distinguishable from zero; the effect size says whether it is worth caring about.

- Class: text
  Output: Second case - two separate groups of people. Do men and women place themselves differently?

- Class: cmd_question
  Output: Look first, with a boxplot. Type boxplot(lr_self ~ sex, data = swe).
  CorrectAnswer: boxplot(lr_self ~ sex, data = swe)
  AnswerTests: omnitest(correctExpr='boxplot(lr_self ~ sex, data = swe)')
  Hint: Type boxplot(lr_self ~ sex, data = swe). The tilde means 'by'.

- Class: text
  Output: A boxplot shows the spread well, but the thick line in each box is the median, not the mean. The t-test compares means, and its output prints them.

- Class: cmd_question
  Output: Now the test, in the same formula notation. Type t.test(lr_self ~ sex, data = swe).
  CorrectAnswer: t.test(lr_self ~ sex, data = swe)
  AnswerTests: omnitest(correctExpr='t.test(lr_self ~ sex, data = swe)')
  Hint: Type t.test(lr_self ~ sex, data = swe). The data argument says where to find the variables, which is why they appear without swe dollar sign.

- Class: text
  Output: The confidence interval now refers to the difference between the two means, and it does not contain zero. R subtracts the second group from the first, following the factor levels - Men minus Women - so a positive interval means men place themselves further right.

- Class: text
  Output: Third case, and the one most often got wrong - the same people measured twice, with something happening in between. Twelve people with a fear of spiders have their anxiety measured while looking at a picture of a tarantula, and again later in front of the real one. The numbers are hypothetical, from Field, Miles and Field (2012), Discovering Statistics Using R.

- Class: cmd_question
  Output: The data are loaded as spider, one row per person. Type spider to look at them.
  CorrectAnswer: spider
  AnswerTests: omnitest(correctExpr='spider')
  Hint: Type spider.

- Class: cmd_question
  Output: picture is each person's anxiety with the picture, real with the real spider. Keeping both in one row is what records that they belong to the same person. First the mean of spider$picture.
  CorrectAnswer: mean(spider$picture)
  AnswerTests: omnitest(correctExpr='mean(spider$picture)')
  Hint: Type mean(spider$picture).

- Class: cmd_question
  Output: Now the mean of spider$real.
  CorrectAnswer: mean(spider$real)
  AnswerTests: omnitest(correctExpr='mean(spider$real)')
  Hint: Type mean(spider$real).

- Class: cmd_question
  Output: 40 with the picture, 47 with the real spider. Test it with paired = TRUE, which works on the differences - one per person. Type t.test(spider$real, spider$picture, paired = TRUE).
  CorrectAnswer: t.test(spider$real, spider$picture, paired = TRUE)
  AnswerTests: any_of_exprs('t.test(spider$real, spider$picture, paired = TRUE)', 't.test(spider$real, spider$picture, paired=TRUE)')
  Hint: Type t.test(spider$real, spider$picture, paired = TRUE).

- Class: text
  Output: A mean difference of 7 points, t = 2.47 on 11 degrees of freedom, p = 0.031. With only twelve people the fatter tails of the t distribution matter.

- Class: cmd_question
  Output: That test is nothing new. Make each person's difference - type spider$difference <- spider$real - spider$picture.
  CorrectAnswer: spider$difference <- spider$real - spider$picture
  AnswerTests: omnitest(correctExpr='spider$difference <- spider$real - spider$picture')
  Hint: Type spider$difference <- spider$real - spider$picture.

- Class: cmd_question
  Output: Now run the one-sample test from the start of this lesson on the differences, against zero. Type t.test(spider$difference, mu = 0).
  CorrectAnswer: t.test(spider$difference, mu = 0)
  AnswerTests: any_of_exprs('t.test(spider$difference, mu = 0)', 't.test(spider$difference, mu=0)')
  Hint: Type t.test(spider$difference, mu = 0).

- Class: text
  Output: The same t, the same degrees of freedom, the same p-value. A paired t-test is a one-sample t-test of the differences against zero.

- Class: text
  Output: Use the paired version whenever the two numbers come from the same unit. Using an independent test on paired data throws the pairing away and usually hides a real effect. Using a paired test on data that is not paired is simply invalid, whatever R prints.

- Class: text
  Output: Last thing. With three or more groups, running a t-test on every pair is wrong - each test has its own chance of a false positive, and with enough pairs one will fire.

- Class: cmd_question
  Output: The tool is analysis of variance, which asks whether any of the group means differ. Fit it with model <- aov(lr_self ~ ses, data = swe).
  CorrectAnswer: model <- aov(lr_self ~ ses, data = swe)
  AnswerTests: omnitest(correctExpr='model <- aov(lr_self ~ ses, data = swe)')
  Hint: Type model <- aov(lr_self ~ ses, data = swe).

- Class: cmd_question
  Output: Print the test with summary(model).
  CorrectAnswer: summary(model)
  AnswerTests: omnitest(correctExpr='summary(model)')
  Hint: Type summary(model).

- Class: text
  Output: The four social class groups do not all place themselves in the same place. That is all it says - not which groups differ. ANOVA is a special case of regression, which starts in session 11, and it is easier to understand from that direction. Treat this as a signpost.
