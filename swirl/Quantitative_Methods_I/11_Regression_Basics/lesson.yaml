- Class: meta
  Course: Quantitative Methods I
  Lesson: 11 - The Basic Regression Model
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: Regression is the workhorse - everything in the remaining sessions is a variation on it. The survey is loaded as swe, with last week's trust score already computed as swe$trust.

- Class: text
  Output: The question - do people who trust institutions more also think their country is more democratic?

- Class: cmd_question
  Output: Look first. Plot demlevel against trust with plot(swe$trust, swe$demlevel).
  CorrectAnswer: plot(swe$trust, swe$demlevel)
  AnswerTests: omnitest(correctExpr='plot(swe$trust, swe$demlevel)')
  Hint: Type plot(swe$trust, swe$demlevel).

- Class: cmd_question
  Output: Now fit the line. Type model1 <- lm(demlevel ~ trust, data = swe).
  CorrectAnswer: model1 <- lm(demlevel ~ trust, data = swe)
  AnswerTests: omnitest(correctExpr='model1 <- lm(demlevel ~ trust, data = swe)')
  Hint: Type model1 <- lm(demlevel ~ trust, data = swe). The outcome goes to the left of the tilde.

- Class: cmd_question
  Output: Print the full output with summary(model1).
  CorrectAnswer: summary(model1)
  AnswerTests: omnitest(correctExpr='summary(model1)')
  Hint: Type summary(model1).

- Class: text
  Output: Regression picks the line that minimises the total squared vertical distance between the points and the line. Squaring means the distances cannot cancel, and it also means a point twice as far away counts four times as much - which is why outliers matter.

- Class: mult_question
  Output: The slope on trust is 1.08. Trust is a factor score, standardised to a mean of 0 and a standard deviation of 1. What does 1.08 mean?
  CorrectAnswer: One standard deviation more trust goes with a 1.08-point higher rating on the 0-10 scale.
  AnswerChoices: One standard deviation more trust goes with a 1.08-point higher rating on the 0-10 scale.; Trust explains 108 per cent of the rating.; The rating is 1.08 times higher for trusting people.
  AnswerTests: omnitest(correctVal='One standard deviation more trust goes with a 1.08-point higher rating on the 0-10 scale.')
  Hint: The units of a slope are always outcome units per predictor unit. What is one unit of a standardised score?

- Class: text
  Output: The intercept, 7.81, is the predicted rating when every predictor is zero. Trust averages zero, so that is the prediction for a person with average trust. An intercept only means something when zero is a real value of the predictor.

- Class: mult_question
  Output: The output shows Multiple R-squared 0.301. What is that?
  CorrectAnswer: The share of the variance in the outcome that the model accounts for.
  AnswerChoices: The share of the variance in the outcome that the model accounts for.; The correlation between trust and demlevel.; The probability that the model is correct.
  AnswerTests: omnitest(correctVal='The share of the variance in the outcome that the model accounts for.')
  Hint: R-squared, as the name suggests, is related to r. What do you get if you square the correlation?

- Class: cmd_question
  Output: Check that. With one predictor, R-squared is exactly the correlation squared. Type cor(swe$trust, swe$demlevel, use = "complete.obs")^2.
  CorrectAnswer: cor(swe$trust, swe$demlevel, use = "complete.obs")^2
  AnswerTests: any_of_exprs('cor(swe$trust, swe$demlevel, use = "complete.obs")^2', 'cor(swe$trust, swe$demlevel, use="complete.obs")^2')
  Hint: Type cor(swe$trust, swe$demlevel, use = "complete.obs")^2.

- Class: text
  Output: A model is a machine for producing predicted values, and what it gets wrong for each case is the residual.

- Class: cmd_question
  Output: Look at the residuals. Type summary(residuals(model1)).
  CorrectAnswer: summary(residuals(model1))
  AnswerTests: omnitest(correctExpr='summary(residuals(model1))')
  Hint: Type summary(residuals(model1)).

- Class: text
  Output: Now the part where regression earns its place. In 2022 the right bloc won the election. Does voting for the winning side go with rating democracy differently?

- Class: cmd_question
  Output: Fit it. Type model2 <- lm(demlevel ~ bloc, data = swe).
  CorrectAnswer: model2 <- lm(demlevel ~ bloc, data = swe)
  AnswerTests: omnitest(correctExpr='model2 <- lm(demlevel ~ bloc, data = swe)')
  Hint: Type model2 <- lm(demlevel ~ bloc, data = swe).

- Class: cmd_question
  Output: Show just the coefficients, rounded. Type round(coef(summary(model2)), 3).
  CorrectAnswer: round(coef(summary(model2)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model2)), 3)')
  Hint: Type round(coef(summary(model2)), 3).

- Class: text
  Output: Right bloc voters rate Swedish democracy 0.49 points lower, and it is clearly significant. That is worth pausing on, because the literature predicts the opposite - the winners are usually more satisfied, and the right bloc won.

- Class: cmd_question
  Output: Now add trust to the model. Type model3 <- lm(demlevel ~ bloc + trust, data = swe).
  CorrectAnswer: model3 <- lm(demlevel ~ bloc + trust, data = swe)
  AnswerTests: omnitest(correctExpr='model3 <- lm(demlevel ~ bloc + trust, data = swe)')
  Hint: Type model3 <- lm(demlevel ~ bloc + trust, data = swe).

- Class: cmd_question
  Output: Look at the coefficients again - round(coef(summary(model3)), 3).
  CorrectAnswer: round(coef(summary(model3)), 3)
  AnswerTests: omnitest(correctExpr='round(coef(summary(model3)), 3)')
  Hint: Type round(coef(summary(model3)), 3).

- Class: text
  Output: The bloc coefficient has collapsed from minus 0.49 to minus 0.12, and its p-value has gone from below 0.001 to 0.066. It is no longer distinguishable from zero.

- Class: cmd_question
  Output: Why? Because the two groups differ in trust. Check with tapply(swe$trust, swe$bloc, mean, na.rm = TRUE).
  CorrectAnswer: tapply(swe$trust, swe$bloc, mean, na.rm = TRUE)
  AnswerTests: any_of_exprs('tapply(swe$trust, swe$bloc, mean, na.rm = TRUE)', 'tapply(swe$trust, swe$bloc, mean, na.rm=TRUE)')
  Hint: Type tapply(swe$trust, swe$bloc, mean, na.rm = TRUE).

- Class: mult_question
  Output: Left bloc voters are more trusting. What does the coefficient on bloc mean in model3, where trust is also included?
  CorrectAnswer: The difference between the blocs among people with the same level of trust.
  AnswerChoices: The difference between the blocs among people with the same level of trust.; The total difference between the blocs, corrected for error.; The part of the bloc effect that is caused by trust.
  AnswerTests: omnitest(correctVal='The difference between the blocs among people with the same level of trust.')
  Hint: That is what 'holding the other predictors constant' means.

- Class: text
  Output: The apparent bloc difference was largely trust wearing a bloc costume. But be careful - the arithmetic is agnostic about which variable is doing what. The same output fits 'trust causes both' and 'bloc causes trust, which causes the rating'. In the second case controlling for trust would be a mistake. Only an argument about the world can tell them apart.

- Class: cmd_question
  Output: Fit a fuller model. Type model4 <- lm(demlevel ~ trust + bloc + age + educ, data = swe).
  CorrectAnswer: model4 <- lm(demlevel ~ trust + bloc + age + educ, data = swe)
  AnswerTests: omnitest(correctExpr='model4 <- lm(demlevel ~ trust + bloc + age + educ, data = swe)')
  Hint: Type model4 <- lm(demlevel ~ trust + bloc + age + educ, data = swe).

- Class: cmd_question
  Output: Print summary(model4).
  CorrectAnswer: summary(model4)
  AnswerTests: omnitest(correctExpr='summary(model4)')
  Hint: Type summary(model4).

- Class: cmd_question
  Output: Notice the line about observations deleted due to missingness. Check how many cases the model actually used with nobs(model4).
  CorrectAnswer: nobs(model4)
  AnswerTests: omnitest(correctExpr='nobs(model4)')
  Hint: Type nobs(model4).

- Class: text
  Output: 2097 of 2845. Every variable you add drops everyone missing on it, and the losses compound. Always report the n the model actually ran on.

- Class: cmd_question
  Output: Finally, check the model. Type plot(model4, which = 1) for residuals against fitted values.
  CorrectAnswer: plot(model4, which = 1)
  AnswerTests: any_of_exprs('plot(model4, which = 1)', 'plot(model4, which=1)')
  Hint: Type plot(model4, which = 1).

- Class: mult_question
  Output: The residuals should be a shapeless band around zero, but there is a clean diagonal edge along the bottom right. What is that?
  CorrectAnswer: A floor effect - the outcome cannot go below 0, so residuals cannot be very negative where predictions are high.
  AnswerChoices: A floor effect - the outcome cannot go below 0, so residuals cannot be very negative where predictions are high.; Evidence that a variable is missing from the model.; A sign that the errors are not independent.
  AnswerTests: omnitest(correctVal='A floor effect - the outcome cannot go below 0, so residuals cannot be very negative where predictions are high.')
  Hint: The outcome is a 0 to 10 scale. What is the smallest residual possible for someone predicted to be at 9?

- Class: text
  Output: That is session 4 turning up in the middle of a regression. The limits of the scale constrain what the model can do, and OLS does not know they exist. Next week - presenting all this to somebody else.
