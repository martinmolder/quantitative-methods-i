- Class: meta
  Course: Quantitative Methods I
  Lesson: 10 - Factor Analysis
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: The survey asked how much people trust seven institutions - parliament, government, judiciary, scientists, parties, traditional media and social media. That gives seven variables. The question is whether it gives seven things.

- Class: cmd_question
  Output: Pull the seven items into an object called trust_items. Type trust_items <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media", "tr_socmed")].
  CorrectAnswer: trust_items <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media", "tr_socmed")]
  AnswerTests: omnitest(correctExpr='trust_items <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media", "tr_socmed")]')
  Hint: Type trust_items <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media", "tr_socmed")].

- Class: cmd_question
  Output: Look at the correlations first, as always. Type round(cor(trust_items, use = "pairwise.complete.obs"), 2).
  CorrectAnswer: round(cor(trust_items, use = "pairwise.complete.obs"), 2)
  AnswerTests: any_of_exprs('round(cor(trust_items, use = "pairwise.complete.obs"), 2)', 'round(cor(trust_items, use="pairwise.complete.obs"), 2)')
  Hint: Type round(cor(trust_items, use = "pairwise.complete.obs"), 2).

- Class: mult_question
  Output: Nearly everything correlates positively with nearly everything. But one column is different. Which item stands out?
  CorrectAnswer: tr_socmed - trust in social media correlates only weakly with the rest.
  AnswerChoices: tr_socmed - trust in social media correlates only weakly with the rest.; tr_parl - trust in parliament, which correlates too strongly.; tr_sci - trust in scientists, which correlates negatively.
  AnswerTests: omnitest(correctVal='tr_socmed - trust in social media correlates only weakly with the rest.')
  Hint: Look down the last column. Are those numbers the same size as the others?

- Class: text
  Output: The idea behind factor analysis is that the correlations are produced by something the variables have in common - an unobserved disposition that makes someone answer all seven questions a bit more positively or a bit more negatively. That unobserved thing is the factor.

- Class: cmd_question
  Output: Now, how many factors? An eigenvalue measures how much variance a potential factor accounts for, in units where each item is worth 1. Type round(eigen(cor(trust_items, use = "pairwise.complete.obs"))$values, 2).
  CorrectAnswer: round(eigen(cor(trust_items, use = "pairwise.complete.obs"))$values, 2)
  AnswerTests: any_of_exprs('round(eigen(cor(trust_items, use = "pairwise.complete.obs"))$values, 2)', 'round(eigen(cor(trust_items, use="pairwise.complete.obs"))$values, 2)')
  Hint: Type round(eigen(cor(trust_items, use = "pairwise.complete.obs"))$values, 2).

- Class: text
  Output: The first is 3.18 - worth more than three items on its own. The second is 1.05, and everything after that is below 1. The Kaiser rule keeps factors above 1, so it says two. A scree plot - the eigenvalues plotted in order - drops steeply after the first and then flattens, which suggests one. The criteria disagree, which is normal.

- Class: text
  Output: The real test is whether a solution is interpretable - whether the items that hang together correspond to something you can name and defend. Start with one factor.

- Class: cmd_question
  Output: Fit it. Type one_factor <- fa(trust_items, nfactors = 1, fm = "ml").
  CorrectAnswer: one_factor <- fa(trust_items, nfactors = 1, fm = "ml")
  AnswerTests: any_of_exprs('one_factor <- fa(trust_items, nfactors = 1, fm = "ml")', 'one_factor <- fa(trust_items, nfactors=1, fm="ml")')
  Hint: Type one_factor <- fa(trust_items, nfactors = 1, fm = "ml"). The fm argument is the estimation method - ml for maximum likelihood.

- Class: cmd_question
  Output: Look at the loadings - the correlations between each item and the factor. Type one_factor$loadings.
  CorrectAnswer: one_factor$loadings
  AnswerTests: omnitest(correctExpr='one_factor$loadings')
  Hint: Type one_factor$loadings.

- Class: mult_question
  Output: Parliament loads at 0.84 and government at 0.84. Social media loads at 0.13. By convention anything below about 0.3 is not really loading. What does that tell you?
  CorrectAnswer: Trust in social media is not part of the same disposition as trust in institutions.
  AnswerChoices: Trust in social media is not part of the same disposition as trust in institutions.; The factor analysis has failed and should be abandoned.; Social media needs to be reverse-coded.
  AnswerTests: omnitest(correctVal='Trust in social media is not part of the same disposition as trust in institutions.')
  Hint: A loading of 0.13 is a finding, not a nuisance. Is social media an institution people are asked to have confidence in?

- Class: cmd_question
  Output: Drop it and refit on the six that belong. Type trust_six <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media")].
  CorrectAnswer: trust_six <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media")]
  AnswerTests: omnitest(correctExpr='trust_six <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media")]')
  Hint: Type trust_six <- swe[, c("tr_parl", "tr_govt", "tr_court", "tr_sci", "tr_party", "tr_media")].

- Class: cmd_question
  Output: Now fit one factor on those six, in an object called six_factor.
  CorrectAnswer: six_factor <- fa(trust_six, nfactors = 1, fm = "ml")
  AnswerTests: any_of_exprs('six_factor <- fa(trust_six, nfactors = 1, fm = "ml")', 'six_factor <- fa(trust_six, nfactors=1, fm="ml")')
  Hint: Type six_factor <- fa(trust_six, nfactors = 1, fm = "ml").

- Class: cmd_question
  Output: Look at the new loadings.
  CorrectAnswer: six_factor$loadings
  AnswerTests: omnitest(correctExpr='six_factor$loadings')
  Hint: Type six_factor$loadings.

- Class: text
  Output: Every item now loads above 0.4, and the variance explained rises from 38 per cent to 44. Dropping the item that did not belong made the solution stronger.

- Class: text
  Output: A related question - if these six are meant to measure one thing, how consistently do they do it? Cronbach's alpha measures that.

- Class: cmd_question
  Output: Type psych::alpha(trust_six)$total$raw_alpha. The package name is written out because several packages define a function called alpha.
  CorrectAnswer: psych::alpha(trust_six)$total$raw_alpha
  AnswerTests: omnitest(correctExpr='psych::alpha(trust_six)$total$raw_alpha')
  Hint: Type psych::alpha(trust_six)$total$raw_alpha.

- Class: text
  Output: 0.81. The rough conventions are 0.7 acceptable, 0.8 good, 0.9 excellent - though above 0.95 the items are probably redundant rather than reliable. With social media included it was 0.78, so dropping the misfit made the scale more reliable, not less.

- Class: text
  Output: Now the practical payoff. Instead of six trust variables, we want one.

- Class: cmd_question
  Output: The factor scores estimate where each respondent sits on the underlying dimension. Save them as a new column - swe$trust <- six_factor$scores[, 1].
  CorrectAnswer: swe$trust <- six_factor$scores[, 1]
  AnswerTests: omnitest(correctExpr='swe$trust <- six_factor$scores[, 1]')
  Hint: Type swe$trust <- six_factor$scores[, 1].

- Class: cmd_question
  Output: Check it. Type summary(swe$trust).
  CorrectAnswer: summary(swe$trust)
  AnswerTests: omnitest(correctExpr='summary(swe$trust)')
  Hint: Type summary(swe$trust).

- Class: text
  Output: Mean about zero, and 297 missing - the respondents who skipped at least one item. fa() returns one row per respondent with NA where it could not compute, which is why that assignment works directly.

- Class: cmd_question
  Output: Now its spread. Type sd(swe$trust, na.rm = TRUE).
  CorrectAnswer: sd(swe$trust, na.rm = TRUE)
  AnswerTests: any_of_exprs('sd(swe$trust, na.rm = TRUE)', 'sd(swe$trust, na.rm=TRUE)')
  Hint: Type sd(swe$trust, na.rm = TRUE).

- Class: text
  Output: About 0.93 - close to 1, but not quite. A factor score is an estimate, and an estimate is pulled towards the average when someone's answers say little about them. So one unit of the trust score is a little more than one standard deviation. Remember that when you read regression coefficients for trust in later lessons.

- Class: text
  Output: Never assign scores into only the complete rows by hand. The lengths will not match, R will recycle, and everybody gets somebody else's score. The broken version does not look broken - when this lesson was written it produced differences between parties of a few hundredths, which reads as a perfectly plausible finding of no difference.

- Class: cmd_question
  Output: So check the new variable against something you already know. Compare mean trust by party - type tapply(swe$trust, swe$vote, mean, na.rm = TRUE).
  CorrectAnswer: tapply(swe$trust, swe$vote, mean, na.rm = TRUE)
  AnswerTests: any_of_exprs('tapply(swe$trust, swe$vote, mean, na.rm = TRUE)', 'tapply(swe$trust, swe$vote, mean, na.rm=TRUE)')
  Hint: Type tapply(swe$trust, swe$vote, mean, na.rm = TRUE). tapply() applies a function to one variable split by another.

- Class: text
  Output: Sweden Democrat voters are by some distance the least trusting. Green, Centre and Social Democrat voters the most. That is a recognisable pattern - and vote choice was never in the factor analysis.

- Class: cmd_question
  Output: One more check, against a variable that should be related. Type cor(swe$trust, swe$satdem, use = "complete.obs").
  CorrectAnswer: cor(swe$trust, swe$satdem, use = "complete.obs")
  AnswerTests: any_of_exprs('cor(swe$trust, swe$satdem, use = "complete.obs")', 'cor(swe$trust, swe$satdem, use="complete.obs")')
  Hint: Type cor(swe$trust, swe$satdem, use = "complete.obs").

- Class: text
  Output: 0.53 with satisfaction with democracy - strongly related, as it should be, but nowhere near 1, so it is not simply the same variable again. From here trust is an ordinary continuous variable, and next week it goes into a regression.

- Class: text
  Output: Last thing. We asked the six items to be one thing, and they were willing - but willing is not the same as best described that way. Research on political trust distinguishes trust in the institutions of party politics from trust in institutions that hold authority without standing for election. If that split is in these answers, one factor is hiding it.

- Class: cmd_question
  Output: Try two factors. Type two_factors <- fa(trust_six, nfactors = 2, rotate = "varimax", fm = "ml").
  CorrectAnswer: two_factors <- fa(trust_six, nfactors = 2, rotate = "varimax", fm = "ml")
  AnswerTests: any_of_exprs('two_factors <- fa(trust_six, nfactors = 2, rotate = "varimax", fm = "ml")', 'two_factors <- fa(trust_six, nfactors=2, rotate="varimax", fm="ml")')
  Hint: Type two_factors <- fa(trust_six, nfactors = 2, rotate = "varimax", fm = "ml").

- Class: cmd_question
  Output: Print the loadings, hiding the small ones. Type print(two_factors$loadings, cutoff = 0.3).
  CorrectAnswer: print(two_factors$loadings, cutoff = 0.3)
  AnswerTests: any_of_exprs('print(two_factors$loadings, cutoff = 0.3)', 'print(two_factors$loadings, cutoff=0.3)')
  Hint: Type print(two_factors$loadings, cutoff = 0.3).

- Class: mult_question
  Output: Parliament, government and parties load mainly on one factor; scientists and media on the other. What is the split?
  CorrectAnswer: Institutions of party politics against institutions with authority but no electoral role.
  AnswerChoices: Institutions of party politics against institutions with authority but no electoral role.; National institutions against international ones.; Institutions people trust against institutions they do not.
  AnswerTests: omnitest(correctVal='Institutions of party politics against institutions with authority but no electoral role.')
  Hint: Which of these six do you vote for and against?

- Class: text
  Output: That is a real distinction in the research on political trust, and it did not have to appear here. Note the judiciary, loading 0.49 on each - an item that loads about equally on two factors is called a cross-loading, and here it is telling you something about what a constitutional court is for.

- Class: text
  Output: Now rotation. With more than one factor the solution is not unique - several sets of axes describe the same data equally well. Rotation picks the one that is easiest to read. Varimax, which we used, is orthogonal - it keeps the two factors uncorrelated, so each can be read on its own.

- Class: text
  Output: That is a simplification. People who trust parliament probably also tend to trust scientists, and oblique rotations, which let the factors correlate, are arguably more correct for most social-science data. They are also harder to read. This course stays with orthogonal factors.

- Class: text
  Output: So - one factor or two? Both are defensible fits to the same six items. For the six items the criteria point to one, and if you want one variable for a regression, take one. If your argument is specifically about trust in politicians against trust in expertise, take two, and say why. The criteria will not make that choice for you.
