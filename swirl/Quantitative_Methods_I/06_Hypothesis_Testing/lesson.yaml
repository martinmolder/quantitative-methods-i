- Class: meta
  Course: Quantitative Methods I
  Lesson: 06 - The Logic of Hypothesis Testing
  Author: Martin Molder
  Type: Standard
  Organization: University of Tartu
  Version: 1.0.0

- Class: text
  Output: This lesson has no new method in it. It is the reasoning that everything from here on depends on. Two objects are loaded - swe, the Swedish survey, and turnout, a small table comparing what 18 election studies report about turnout with what actually happened.

- Class: cmd_question
  Output: Start with the turnout table. Look at the Swedish row - subset turnout to the rows where study equals "SWE_2022", keeping all columns.
  CorrectAnswer: turnout[turnout$study == "SWE_2022", ]
  AnswerTests: any_of_exprs('turnout[turnout$study == "SWE_2022", ]', 'turnout[turnout$study=="SWE_2022", ]')
  Hint: Type turnout[turnout$study == "SWE_2022", ]. Remember the comma before the closing bracket.

- Class: text
  Output: 97.3 per cent of respondents say they voted. The real figure was 84.2. The survey is out by 13.1 percentage points. The question is whether that is bad luck or something worse.

- Class: cmd_question
  Output: If it were bad luck, other studies would miss in the other direction. Check. Count how many of the 18 studies over-report, using sum() on the comparison turnout$gap > 0.
  CorrectAnswer: sum(turnout$gap > 0)
  AnswerTests: omnitest(correctExpr='sum(turnout$gap > 0)')
  Hint: Type sum(turnout$gap > 0).

- Class: mult_question
  Output: Eighteen studies out of eighteen over-report turnout. What does that tell you?
  CorrectAnswer: The error is systematic, not random - it goes the same way every time.
  AnswerChoices: The error is systematic, not random - it goes the same way every time.; The samples were all too small.; It is a coincidence, since 18 is not many studies.
  AnswerTests: omnitest(correctVal='The error is systematic, not random - it goes the same way every time.')
  Hint: Random error goes both ways. Does this?

- Class: text
  Output: That is the distinction the whole lesson turns on. Random error is the sample missing the population by chance - it goes both ways, it shrinks as the sample grows, and it can be measured. Systematic error goes one way, does not shrink with sample size, and no method in this course will find it.

- Class: text
  Output: Now to measuring the random part. First we need a measure of spread. Take the left-right self-placement variable, dropping the missing values.

- Class: cmd_question
  Output: Put the non-missing values of swe$lr_self into an object called lr. Use square brackets with the condition !is.na(swe$lr_self).
  CorrectAnswer: lr <- swe$lr_self[!is.na(swe$lr_self)]
  AnswerTests: omnitest(correctExpr='lr <- swe$lr_self[!is.na(swe$lr_self)]')
  Hint: Type lr <- swe$lr_self[!is.na(swe$lr_self)]. The exclamation mark means 'not'.

- Class: cmd_question
  Output: The natural measure of spread is how far each case sits from the mean. Make an object called deviations, equal to lr minus its own mean.
  CorrectAnswer: deviations <- lr - mean(lr)
  AnswerTests: omnitest(correctExpr='deviations <- lr - mean(lr)')
  Hint: Type deviations <- lr - mean(lr).

- Class: cmd_question
  Output: Add them all up, rounding to 10 decimal places so you can see what you get. Use round(sum(deviations), 10).
  CorrectAnswer: round(sum(deviations), 10)
  AnswerTests: omnitest(correctExpr='round(sum(deviations), 10)')
  Hint: Type round(sum(deviations), 10).

- Class: text
  Output: Zero. Exactly zero, not approximately. That is what a mean is - the point where the distances above and below balance. So the sum of deviations is useless as a measure of spread. It is zero for every variable that ever existed.

- Class: cmd_question
  Output: The fix is to square them first, so they are all positive, then average. That average is the variance. Use var() on lr.
  CorrectAnswer: var(lr)
  AnswerTests: omnitest(correctExpr='var(lr)')
  Hint: Type var(lr).

- Class: cmd_question
  Output: Squaring fixed one problem and made another - the variance is in squared scale points, which means nothing. Take the square root to get back to the original scale. That is the standard deviation. Use sd() on lr.
  CorrectAnswer: sd(lr)
  AnswerTests: omnitest(correctExpr='sd(lr)')
  Hint: Type sd(lr).

- Class: text
  Output: About 2.8 points on a scale that runs from 0 to 10. Roughly, that is the typical distance of a respondent from the average.

- Class: text
  Output: Now the central idea. Pretend for a moment that these 2448 respondents are the whole population, and their mean is the truth. What happens if you take a small sample from them?

- Class: cmd_question
  Output: Fix the random number generator first, so that your results match mine. Type set.seed(2026).
  CorrectAnswer: set.seed(2026)
  AnswerTests: omnitest(correctExpr='set.seed(2026)')
  Hint: Type set.seed(2026).

- Class: cmd_question
  Output: Now draw 50 of them at random and take the mean. Use mean(sample(lr, size = 50)).
  CorrectAnswer: mean(sample(lr, size = 50))
  AnswerTests: any_of_exprs('mean(sample(lr, size = 50))', 'mean(sample(lr, size=50))')
  Hint: Type mean(sample(lr, size = 50)). The sample() function draws at random from a vector.

- Class: text
  Output: That sample missed the true mean. Another one would miss differently. The question is - by how much, typically?

- Class: cmd_question
  Output: We can just do it. replicate() runs an expression many times and collects the results. Run the same sample mean 2000 times and put the answers in an object called sample_means.
  CorrectAnswer: sample_means <- replicate(2000, mean(sample(lr, size = 50)))
  AnswerTests: any_of_exprs('sample_means <- replicate(2000, mean(sample(lr, size = 50)))', 'sample_means <- replicate(2000, mean(sample(lr, size=50)))')
  Hint: Type sample_means <- replicate(2000, mean(sample(lr, size = 50))).

- Class: cmd_question
  Output: Look at what 2000 samples produced. Draw a histogram - hist(sample_means).
  CorrectAnswer: hist(sample_means)
  AnswerTests: omnitest(correctExpr='hist(sample_means)')
  Hint: Type hist(sample_means).

- Class: text
  Output: Three things to notice. It is centred on the truth. It is bell-shaped, even though lr_self itself is a lumpy scale with a spike at 5. And it has a measurable spread.

- Class: cmd_question
  Output: Compare its centre with the population mean. Take mean() of sample_means.
  CorrectAnswer: mean(sample_means)
  AnswerTests: omnitest(correctExpr='mean(sample_means)')
  Hint: Type mean(sample_means).

- Class: cmd_question
  Output: Now the number we actually want - how far a sample of 50 typically misses by. Take sd() of sample_means.
  CorrectAnswer: sd(sample_means)
  AnswerTests: omnitest(correctExpr='sd(sample_means)')
  Hint: Type sd(sample_means).

- Class: text
  Output: That is the standard error. We could only simulate it because we had all 2448 cases and could pretend they were a population. In real research you have one sample and no way to draw another.

- Class: cmd_question
  Output: The remarkable thing is that you do not need to. The standard error is the standard deviation divided by the square root of the sample size. Calculate sd(lr) divided by sqrt(50).
  CorrectAnswer: sd(lr) / sqrt(50)
  AnswerTests: any_of_exprs('sd(lr) / sqrt(50)', 'sd(lr)/sqrt(50)')
  Hint: Type sd(lr) / sqrt(50).

- Class: text
  Output: 0.395, against the 0.400 that two thousand simulated samples gave. The formula tells you from one sample what all that repetition would have shown.

- Class: mult_question
  Output: The sample size is under a square root. What follows from that?
  CorrectAnswer: To halve the standard error you need four times as much data.
  AnswerChoices: To halve the standard error you need four times as much data.; To halve the standard error you need twice as much data.; Sample size has no effect on the standard error.
  AnswerTests: omnitest(correctVal='To halve the standard error you need four times as much data.')
  Hint: If n goes up by a factor of four, what happens to the square root of n?

- Class: text
  Output: This is why the difference between a survey of 1000 and one of 2000 is much smaller than people expect, and why 'is the sample big enough' is rarely the useful question.

- Class: cmd_question
  Output: Now build a confidence interval for the full sample. First the standard error - divide sd(lr) by the square root of length(lr), and put it in an object called se.
  CorrectAnswer: se <- sd(lr) / sqrt(length(lr))
  AnswerTests: any_of_exprs('se <- sd(lr) / sqrt(length(lr))', 'se <- sd(lr)/sqrt(length(lr))')
  Hint: Type se <- sd(lr) / sqrt(length(lr)).

- Class: text
  Output: In a normal distribution about 95 per cent of values lie within 1.96 standard deviations of the mean. Applied to a sampling distribution, that says about 95 per cent of samples land within 1.96 standard errors of the truth.

- Class: cmd_question
  Output: Build the interval. Type mean(lr) + c(-1.96, 1.96) * se.
  CorrectAnswer: mean(lr) + c(-1.96, 1.96) * se
  AnswerTests: any_of_exprs('mean(lr) + c(-1.96, 1.96) * se', 'mean(lr) + c(-1.96,1.96)*se')
  Hint: Type mean(lr) + c(-1.96, 1.96) * se. Multiplying a two-element vector gives you both ends at once.

- Class: mult_question
  Output: What does that interval mean?
  CorrectAnswer: A range of values for the population figure that this sample is consistent with.
  AnswerChoices: A range of values for the population figure that this sample is consistent with.; There is a 95 per cent probability that the true value is inside it.; 95 per cent of respondents gave an answer inside it.
  AnswerTests: omnitest(correctVal='A range of values for the population figure that this sample is consistent with.')
  Hint: The population value is a fixed number - it is either inside or it is not. The 95 per cent describes the procedure, not this one interval.

- Class: text
  Output: And notice what it is silent about. That interval measures random error only. It knows nothing about the 13 point turnout gap we started with. A narrow confidence interval on a biased estimate is a precise wrong answer.

- Class: text
  Output: Last piece. Most questions are not 'what is the value' but 'is there anything there'. Those get turned into a pair of hypotheses - the null says nothing is there, the alternative says something is. The test is always the same shape - what we found, divided by how much it could vary by chance.

- Class: mult_question
  Output: That ratio becomes a p-value. Which of these is what a p-value actually is?
  CorrectAnswer: The probability of seeing a result at least this large if the null hypothesis were true.
  AnswerChoices: The probability of seeing a result at least this large if the null hypothesis were true.; The probability that the null hypothesis is true.; The probability that you have made a mistake.
  AnswerTests: omnitest(correctVal='The probability of seeing a result at least this large if the null hypothesis were true.')
  Hint: It assumes the null hypothesis in order to compute the number. Can it then be evidence about whether the null is true?

- Class: text
  Output: The next three sessions are all applications of this one idea - categorical data, means, and correlation. In each case the shape is the same. Something we found, divided by how much it could have varied by chance.
